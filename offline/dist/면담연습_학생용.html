<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI가상면담</title>
<style>
:root{
  --bg:#F2F4F8;
  --surface:#FFFFFF;
  --surface-2:#E6EAF1;
  --ink:#1C2430;
  --muted:#667085;
  --accent:#D98A2B;
  --user-bubble:#FFE8C2;
  --user-bubble-ink:#5C3C10;
  --ai-bubble:#FFFFFF;
  --ai-bubble-border:#E1E5EC;
  --radius:16px;
  --font-display:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121722;
    --surface:#1B222E;
    --surface-2:#242D3B;
    --ink:#E8ECF2;
    --muted:#98A2B3;
    --accent:#E8A33D;
    --user-bubble:#3A2E18;
    --user-bubble-ink:#FCE8C2;
    --ai-bubble:#1F2733;
    --ai-bubble-border:#2E3847;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}
.app-shell{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{padding:20px 20px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;flex:none}
.topbar h1{font-family:var(--font-display);font-size:1.25rem;margin:0}
.tagline{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.view{padding:0 20px 24px;flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
[hidden]{display:none!important}
.disclaimer{background:var(--surface-2);color:var(--muted);font-size:.78rem;padding:10px 14px;border-radius:12px;margin:8px 0 16px}
.disclaimer.small{margin:10px 0}
.figure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.figure-card{background:#FFFFFF;border:1px solid #E1E5EC;border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.figure-card h3{color:#1C2430;font-size:1.4rem}
.figure-card p{color:#4A5568}
.figure-avatar{width:280px;height:280px;max-width:100%;border-radius:50%;background:var(--surface-2);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:4rem;overflow:hidden;flex:none}
.figure-avatar-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.figure-card h3{margin:4px 0 0;font-size:1.4rem}
.figure-card p{margin:0;font-size:.9rem}
.btn-start{margin-top:8px;background:#2FA84F;color:#fff;border:none;border-radius:999px;padding:8px 14px;font-size:.82rem;cursor:pointer;font-weight:700}
.empty{color:var(--muted);font-size:.9rem;padding:20px 0}
.btn-back{background:none;border:none;color:var(--muted);font-size:.9rem;cursor:pointer;padding:8px 0;text-align:left}
.chat-header{display:flex;align-items:center;gap:10px;padding:14px 0 4px;position:sticky;top:0;background:var(--bg);z-index:2}
.chat-person{display:flex;flex-direction:column;min-width:0}
.chat-person strong{font-family:var(--font-display);font-size:1rem}
.chat-person span{font-size:.76rem;color:var(--muted)}
.chat-log{flex:1;display:flex;flex-direction:column;gap:10px;padding:8px 0;overflow-y:auto;min-height:0}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bubble-ai{align-self:flex-start;background:var(--ai-bubble);border:1px solid var(--ai-bubble-border);border-bottom-left-radius:4px}
.bubble-user{align-self:flex-end;background:var(--user-bubble);color:var(--user-bubble-ink);border-bottom-right-radius:4px}
.name-warning{background:#FDECEA;color:#B3432B;font-size:.8rem;line-height:1.45;padding:8px 12px;border-radius:12px;margin:6px 0 0}
.btn-clear-all{align-self:flex-start;background:none;border:1px solid #B3432B;color:#B3432B;font-size:.8rem;border-radius:999px;padding:8px 14px;cursor:pointer;margin-top:16px}
.bubble-pending{opacity:.65}
.chat-form{display:flex;gap:8px;padding:10px 0 4px;position:sticky;bottom:0;background:var(--bg)}
.chat-form input{flex:1;min-width:0;font:inherit;font-family:var(--font-body);background:var(--surface);color:var(--ink);border:1px solid var(--ai-bubble-border);border-radius:999px;padding:12px 16px}
.btn-send{background:var(--accent);color:#fff;border:none;border-radius:50%;width:44px;height:44px;flex:none;font-size:1rem;cursor:pointer}
.chat-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.chat-actions button{background:none;border:1px solid var(--ai-bubble-border);color:var(--muted);font-size:.76rem;border-radius:999px;padding:6px 12px;cursor:pointer}
.chat-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-archive-open{align-self:flex-start;border:none;font-size:1rem;font-weight:700;border-radius:999px;padding:14px 22px;cursor:pointer;margin:4px 10px 16px 0;display:inline-flex;align-items:center;gap:8px}
.btn-archive-open.c-archive{background:#F2994A;color:#3A2103}
.btn-archive-open.c-shared{background:#5B9BD5;color:#0B2A44}
.menu-circle-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;margin-top:24px;width:100%}
.menu-circle-btn{width:150px;height:150px;border-radius:50%;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:.95rem;font-weight:700;line-height:1.3;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .12s ease}
.menu-circle-btn:hover{transform:translateY(-3px)}
.menu-circle-btn:active{transform:translateY(0)}
.menu-circle-icon{font-size:2.1rem;line-height:1}
.menu-circle-btn.c-characters{background:#2FA84F;color:#fff}
.menu-circle-btn.c-archive{background:#F2994A;color:#3A2103}
.menu-circle-btn.c-shared{background:#5B9BD5;color:#0B2A44}
.archive-list{display:flex;flex-direction:column;gap:10px}
.archive-item{background:var(--surface);border:1px solid var(--ai-bubble-border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.archive-item-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.archive-item-top strong{font-family:var(--font-display);font-size:.98rem}
.archive-item-meta{color:var(--muted);font-size:.76rem}
.archive-item-actions{display:flex;gap:8px;margin-top:8px}
.archive-item-actions button{font-size:.78rem;border-radius:999px;padding:6px 12px;cursor:pointer;border:1px solid var(--ai-bubble-border);background:var(--surface-2);color:var(--ink)}
.archive-item-actions button.danger{color:#B3432B;border-color:#B3432B}
.archive-item-locked-wrap{opacity:.75}
.archive-item-locked{font-size:.78rem;color:#8A8F99;font-style:italic}
.archive-item-badge{font-size:.72rem;font-weight:700;color:#2F7AB8;background:#E6F0FA;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.btn-archive-cancel-submit{color:#B3432B;border-color:#B3432B}
.archive-detail-log{flex:1;display:flex;flex-direction:column;gap:10px;padding:8px 0;overflow-y:auto}
.bubble-wrap{display:flex;flex-direction:column;gap:4px}
.bubble-wrap-user{align-items:flex-end}
.bubble-wrap-ai{align-items:flex-start}
.btn-feedback{background:none;border:none;color:var(--muted);font-size:.72rem;cursor:pointer;padding:2px 4px}
.feedback-notes{display:flex;flex-direction:column;gap:4px;max-width:78%}
.feedback-note{font-size:.78rem;padding:6px 10px;border-radius:10px;line-height:1.4}
.feedback-note strong{margin-right:4px}
.feedback-form{display:flex;gap:6px;max-width:78%;margin-top:2px}
.feedback-form textarea{flex:1;font:inherit;font-family:var(--font-body);border:1px solid var(--ai-bubble-border);border-radius:10px;padding:6px 10px;background:var(--surface);color:var(--ink);resize:vertical;min-height:34px;font-size:.82rem}
.feedback-form button{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:0 14px;font-size:.78rem;cursor:pointer}
.room-form{display:flex;flex-direction:column;gap:12px;max-width:360px}
.room-form label{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.room-form input,.room-form select{font:inherit;font-family:var(--font-body);background:var(--surface);color:var(--ink);border:1px solid var(--ai-bubble-border);border-radius:10px;padding:10px 12px}
.room-form .row{display:flex;gap:8px}
.room-form .row label{flex:1}
.room-form .school-row{display:flex;gap:8px}
.room-form .school-row input{flex:2}
.room-form .school-row select{flex:1}
.btn-join{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:.9rem;cursor:pointer;margin-top:4px}
.room-badge{background:var(--surface-2);color:var(--muted);font-size:.78rem;padding:8px 12px;border-radius:12px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.room-badge button{background:none;border:none;color:var(--accent);font-size:.78rem;cursor:pointer;text-decoration:underline}
.form-error{color:#B3432B;font-size:.82rem}
@media (max-width:420px){ .figure-grid{grid-template-columns:1fr} .figure-avatar{width:220px;height:220px} }
.btn-feedback{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* 서버 없는 버전: /api/* 호출을 이 기기 안의 처리로 대신한다. (화면 코드는 그대로) */
(function(){
  'use strict';
  var FIGURES = [{"id": "jensen-huang", "name": "젠슨 황", "job": "엔비디아 CEO", "material": "[출처: tvN 예능 '유 퀴즈 온 더 블럭', 2026년 방영분]\n엔비디아 CEO 젠슨 황은 이 방송에서 '똑똑한 사람'보다 '인간성이 좋은 사람'을 채용 기준으로 더 중요하게 본다고 말했다.\n그는 요즘 세상에는 똑똑한 사람이 너무 많다고 말했다. 좋은 대학과 학생들이 많고, 여기에 AI까지 더해지면서 '지능'은 이제 흔한 것이 되었다고 설명했다.\n그래서 그는 사람을 뽑을 때 가장 중요하게 보는 것은 인간성이라고 말했다. 함께 일할 사람에게서 '베풀 줄 아는 마음'을 찾는다고 했다.\n베푼다는 것의 의미에 대해서는, 상대방이 잘되기를 진심으로 바라는 마음도 베풂의 한 형태라고 설명했다.\n그는 다른 사람이 성공했을 때 배 아파하기보다 진심으로 행복해하는 사람, 관대하고 친절한 사람을 뽑는다고 말했다. 이런 자질이야말로 진짜 가치 있는 능력이며, 이런 사람은 어디서든 성공할 것이라고 했다.\n마지막으로 그는 성공하고 싶다면 이런 사람들로 주변을 채우라고 조언했다.\n(이 자료는 방송 내용을 다룬 기사들을 바탕으로 정리한 것이며, 방송 원문 그대로를 옮긴 것은 아니다.)\n\n[출처: NVIDIA 유튜브 'Huge Conversations' 인터뷰, 영어 인터뷰를 한국어로 요약·정리]\n- 엔비디아를 처음 만들 때의 아이디어: 프로그램 코드 중 일부(약 10%)가 전체 연산의 대부분(약 99%)을 차지하고, 이 부분을 동시에(병렬로) 처리할 수 있다는 점에 주목했다. 순차 처리와 병렬 처리를 모두 잘하는 컴퓨터를 만들자는 것이 출발점이었다고 설명한다.\n- 왜 비디오 게임부터 시작했는지: 게임은 가상 세계를 만드는 일이라 병렬 처리가 꼭 필요했고, 시장도 크게 성장할 거라고 봤다고 말한다. 시장이 커야 연구개발비도 커지고 기술도 더 발전할 수 있었다는 설명이다.\n- GPU를 '타임머신'에 비유: GPU 덕분에 계산이 훨씬 빨라지면서 미래를 더 빨리 내다볼 수 있다는 뜻이다. 한 과학자가 '엔비디아 덕분에 평생 걸릴 연구를 내 생애 안에 할 수 있게 됐다'고 말한 것을 가장 인상 깊었던 말로 꼽는다.\n- CUDA를 만든 이유(2006년경): 일부 연구자들이 그래픽 카드를 그래픽이 아닌 다른 계산(의료 영상 등)에 몰래 활용하는 것을 보고, 프로그래머들이 이미 아는 언어로 GPU를 더 쉽게 쓸 수 있게 하려고 만들었다고 설명한다.\n- 2012년 '알렉스넷' 사건: 토론토대 연구팀이 엔비디아 GPU로 딥러닝 모델을 학습시켜 이미지 인식 대회에서 압도적으로 우승한 일을 계기로, 이 기술이 어디까지 갈 수 있을지 묻기 시작했고 회사 전체의 컴퓨팅 방식을 다시 설계하기로 했다고 말한다.\n- 오래 믿음을 지킨 이유: 어느 시점에는 원칙(물리학이나 깊은 산업 이해)에서 나온 믿음을 가지고 결정해야 하며, 그 믿음이 확고했기에 성과가 나오기 전부터 큰돈을 투자할 수 있었다고 말한다.\n- 로봇(피지컬 AI)에 대한 생각: '움직이는 모든 것은 언젠가 로봇이 될 것이고, 생각보다 빠를 것'이라고 말한다. 로봇을 실제 세계 대신 가상 세계(옴니버스)에서 미리 훈련시키는 방식을 설명한다.\n- AI 안전에 대한 생각: 편향, 허위정보, 사칭 같은 문제를 알고 있으며, 비행기 자동조종장치처럼 여러 겹의 안전장치를 만드는 것이 중요하다고 말한다.\n- 학생들에게 하는 조언: 지금 학생이라면 가장 먼저 AI를 배우겠다고 말하며, 어떤 분야를 선택하든 '이 일을 AI로 어떻게 더 잘할 수 있을까'를 스스로 묻는 습관이 중요하다고 강조한다.\n- 일하는 방식: 아침 5시에 일어나 밤 9시까지, 주말과 휴일에도 일한다고 말하면서도 '정말 좋아하는 일이면 일처럼 느껴지지 않는다'고 말한다.\n\n[출처: 나무위키 '젠슨 황' 문서 — 비교적 검증된 약력 정보. 나무위키는 누구나 편집하는 사전이라 세부 사실은 다른 자료와 교차 확인이 필요하다]\n- 1963년 2월 대만 타이베이 출생. 아버지 직장을 따라 어릴 때 태국으로 이주해 9살까지 살았다.\n- 1973년 태국 정세 불안으로 형과 함께 미국으로 보내져, 이후 켄터키의 기숙학교에 다녔다.\n- 오리건의 알로하 고등학교에서 컴퓨터 동아리 활동을 하며 프로그래밍을 배웠고, 방과 후 데니스(Denny's) 식당에서 설거지와 서빙 아르바이트를 했다.\n- 오리건 주립대에서 전기공학 학사(1984), 스탠퍼드대에서 전기공학 석사(1992)를 받았다. AMD, LSI 로직에서 근무한 경력이 있다.\n- 1993년 크리스 말라초스키, 커티스 프리엠과 함께 엔비디아를 공동 창업했다.\n- 초기 그래픽 칩(NV1)은 어려움을 겪었지만, 이후 RIVA 128과 GeForce 시리즈로 회사가 자리를 잡았다.\n- 2006년 CUDA를 공개했고, 2016년 AI 슈퍼컴퓨터 DGX-1을 공개해 오픈AI 등에 공급했다.\n\n[출처: 카네기멜론 대학교 2026년 졸업식 축사 — 본인이 직접 한 말이므로 신뢰도가 높음]\n- 9살 때 아버지의 결정으로 형과 함께 먼저 미국으로 보내졌고, 켄터키의 탄광 마을에 있는 침례교 기숙학교(오니다)에서 지냈다. 2년 뒤 부모님이 모든 것을 정리하고 합류했다.\n- 아버지는 화학 엔지니어였고, 어머니는 가톨릭 학교에서 청소 일을 하며 새벽 4시에 그를 깨워 신문 배달을 시켰다. 형이 데니스(Denny's) 식당의 설거지 일자리를 구해줬는데, 당시에는 그게 큰 출세처럼 느껴졌다고 말한다.\n- 오리건 주립대 2학년 때 실습 파트너였던 아내 로리를 17살에 만났고(로리는 19살), 지금까지 40년째 결혼 생활 중이며 두 자녀 모두 엔비디아에서 일한다.\n- 30살에 크리스 말라초스키, 커티스 프리엠과 함께 엔비디아를 창업했다. 회사를 어떻게 운영하는지 전혀 몰랐고, '얼마나 어렵겠어'라는 마음으로 시작했지만 실제로는 매우 어려웠다고 말한다. 첫 기술은 제대로 작동하지도 않았다.\n- 세가(Sega)와의 계약 실패 일화: 자금이 거의 바닥났을 때 일본으로 날아가 세가 CEO에게 계약한 기술이 완성되지 않았다고 설명하고, 계약을 풀어달라면서도 그동안의 대금은 지급해달라고 부탁했다. 세가 CEO는 이를 승낙했다. 그는 이 일을 통해 CEO라는 자리는 권력이 아니라 회사를 살려야 하는 책임이며, 정직함과 겸손이 사업에서도 관대함과 친절로 돌아올 수 있다는 것을 배웠다고 말한다.\n- 실패를 성공의 반대가 아니라, 배움의 순간이자 회복력을 기르는 계기로 본다고 말한다. 엔비디아는 33년 동안 '얼마나 어렵겠어'라고 되물으며 스스로를 계속 재창조해왔다고 설명한다.\n- AI 시대에 대한 생각: 자신의 커리어는 PC 혁명과 함께 시작됐듯, 지금 세대는 AI 혁명과 함께 시작한다고 말한다. 사람이 코드를 작성하고 컴퓨터가 그대로 실행하던 방식은 끝났고, 이제는 컴퓨터가 이해하고 추론하고 계획하는 시대라고 설명한다.\n- AI와 일자리에 대해: 많은 작업(task)이 자동화되겠지만, 직업의 목적(purpose)까지 사라지는 것은 아니라고 말한다. 'AI가 당신을 대체하지 않을 수도 있지만, AI를 더 잘 쓰는 사람이 당신을 대체할 수는 있다'고 말한다.\n- 코딩을 몰라도 AI에게 부탁해 웹사이트나 디자인을 만들 수 있는 시대가 됐다며, '이제 누구나 프로그래머가 될 수 있다'고 말한다.\n- 미국의 제조업·에너지 인프라 재건에 대한 기대를 이야기하며, 전기공·배관공·기술자들에게도 큰 기회가 열리는 시대라고 말한다.\n- 졸업생들에게 하는 당부: 카네기멜론의 교훈 '내 마음은 일 속에 있다(My heart is in the work)'를 인용하며, 걷지 말고 뛰라고 말한다.\n\n[출처: 젠슨 황의 대담/패널 인터뷰 영상(AI 인프라·일자리·AGI 관련 질의응답), 영어 인터뷰를 한국어로 요약·정리]\n- AI가 소프트웨어로만 여겨지는 것에 대해: AI(지능)는 소프트웨어에서 시작하지만, 거대언어모델에 지식 검색·작업기억·도구 사용·협업 능력을 더해주는 '에이전트 하네스'를 씌우면 '에이전트'가 된다고 설명한다. 이 에이전트를 로봇 몸체에 넣으면 로봇이 되고, 바퀴 달린 기계에 넣으면 자율주행차가 되고, 조작팔에 넣으면 제조용 로봇팔이 되는 식으로, 본질은 모두 같은 아이디어라고 말한다.\n- AI를 인프라로 보는 관점: AI는 이제 물·도로·전기·인터넷처럼 하나의 인프라이며, 각 나라가 자국 AI 인프라를 구축해야 연구자, 학생, 산업, 스타트업이 활성화된다고 강조한다. 미국은 에너지와 규제 환경 덕분에 큰 규모로 인프라를 지어왔고, 이 투자가 수십만 개의 일자리를 만들고 있다고 말한다.\n- 변화에 대한 두려움에 대해: 새로운 기술은 처음엔 마법처럼 보이지만 사실은 공학(컴퓨터, 소프트웨어, 수학)의 결과이며, 기술을 만드는 사람들이 안전하고 책임감 있게 만들 책임이 있다고 말한다. 오늘날 자동차와 비행기가 100년 전보다 기술이 훨씬 많이 들어갔기 때문에 더 안전한 것처럼, 기술을 더 발전시키는 것이 오히려 더 안전하게 만든다고 주장한다.\n- 이 기술 혁명에서 가장 나쁜 결과: 기술을 두려워해서 제대로 활용하지 못하고 뒤처지는 것이 가장 나쁜 결과라고 말한다. 안전에 대한 논의도 중요하지만, 이 기술이 만들어낼 번영과 가능성에 대한 이야기와 균형을 이뤄야 한다고 말한다.\n- 항공업계 비유: 예전 항공사들은 '우리 비행기가 더 안전하다'고 광고했지만 사람들은 그런 이야기를 듣고 싶어하지 않았고, 안전은 회사가 알아서 책임질 일이라고 여겼다는 일화를 들며, AI의 안전도 업계가 책임져야 할 몫이지 모든 사람이 매일 걱정해야 할 부담이 되어서는 안 된다고 말한다.\n- 규제에 대한 생각: '상상 속의 위험'이 아니라 '실제로 벌어지는 피해'를 기준으로 규제해야 한다고 말하며, 지난 몇 년간 기술 발전을 늦추자는 주장이 있었지만 오히려 기술이 더 발전하면서 AI가 사실에 기반해 답하게 되고 덜 틀리게 되었다고 설명한다.\n- 엔비디아 GPU의 특징: 유체역학, 입자물리학, 양자화학, 컴퓨터 그래픽, 이미지 처리뿐 아니라 AI까지 다루는 범용 병렬처리 장치라고 설명한다. 공개·비공개 모델, 크고 작은 모델을 모두 지원하며 클라우드, 데이터센터, 로봇, 자율주행차 등 어디에나 쓰인다고 말한다. 현재 14세대째 아키텍처를 개발하고 있다고 밝힌다.\n- 범용 설계를 고수하는 이유: AI 인프라는 매우 비싸서(1기가와트 규모 인프라 건설에 약 500~600억 달러), 너무 특정 기술에만 맞춘 설계를 하면 기술이 빠르게 바뀔 때 투자가 쓸모없어질 위험이 있다고 설명한다. 엔비디아 아키텍처는 기술이 바뀌어도 계속 쓸 수 있어 '안전한 투자처'로 여겨진다고 말한다.\n- AGI(범용인공지능)에 대한 생각: 몇 년 안에 AGI를 이룰 것이고, 사실상 거의 다 왔다고 본다고 말한다. 다만 AGI를 이룬다고 모든 회사의 문제가 저절로 풀리는 것은 아니라고 설명한다 — 아무리 뛰어난 신입사원을 뽑아도 회사의 맥락과 목적을 가르치는 데 시간이 필요한 것처럼, AI에게도 맥락을 둘러싼 환경을 만들어주는 일이 여전히 필요하다고 말한다.\n- 일자리에 대한 생각: 우리의 '일(직업)'은 목적과 맥락, 의미로 정해지며, 그 안의 타이핑이나 반복 작업 같은 '과업'은 AI로 자동화되겠지만 일 자체의 목적은 남는다고 말한다. '일자리가 전부 없어질 것'이라는 생각은 말이 안 된다고 분명히 말하며, 대신 우리 모두가 AI 덕분에 더 강력해질 것이라고 설명한다. 엔비디아도 회사 전체에서 다른 회사가 만든 AI와 자체 개발한 AI를 함께 쓰고 있다고 밝힌다.\n- 야망에 대한 이야기: 100년 전이라면 공상과학처럼 들렸을 일들을 지금은 당연하게 기대하고 있다며, 앞으로는 10년 걸리던 일이 1년으로, 1년 걸리던 일이 한 달로 줄어들 것이라고 전망한다. 이제는 보통 사람도 아주 큰 산업에 영향을 미칠 수 있다고 생각하게 된 시대이며, 이것이 바로 '야망'이라고 말한다.\n\n[예상 질문과 답 — 학생들이 비슷한 질문을 하면 아래 내용을 우선 근거로 답한다. '직접 한 말은 찾지 못함'이라고 적힌 부분은 없는 말을 지어내지 말고, 아래 가까운 이야기로 답하거나 '그건 아직 말할 만큼 정해진 게 없어요'처럼 솔직하게 답한다. 구체적인 숫자·날짜·약속은 만들어내지 않는다.]\n\nQ. 사업이 파산 위기에 놓였을 때 어떻게 극복했나요?\n- [출처: 카네기멜론 대학교 2026년 졸업식 축사 — 본인이 직접 한 말] 위 자료의 세가(Sega) 일화를 근거로 답한다. 자금이 거의 바닥났을 때 일본의 세가 CEO를 찾아가 계약한 기술이 완성되지 않았음을 솔직히 설명하고, 계약을 풀어주되 그동안의 대금은 지급해 달라고 부탁했다. 세가 CEO가 승낙해 회사가 버틸 수 있었다. 그는 이 일로 CEO라는 자리는 권력이 아니라 회사를 살려야 하는 책임이며, 정직함과 겸손이 사업에서도 관대함과 친절로 돌아온다는 걸 배웠다고 말한다.\n- 같은 연설에서 실패를 성공의 반대가 아니라 배움의 순간이자 회복력을 기르는 계기로 본다고 했다.\n- 한 블로그(브런치)는 이 일이 1996년이었고 이후 엔비디아가 'RIVA 128'을 개발했다고 소개하지만, 금액이나 '30일 뒤 파산' 같은 세부 내용은 출처가 확인되지 않았으므로 확정적으로 말하지 않는다.\n\nQ. 알바생과 사장(CEO)의 차이는 무엇인가요?\n- 두 입장을 직접 비교한 발언은 찾지 못함. 가까운 이야기로 답한다.\n- [출처: CNBC, 2024년 7월 6일 (2024년 3월 스탠퍼드 경영대학원 인터뷰)] \"To me, no task is beneath me because, remember, I used to be a dishwasher [and] I used to clean toilets\" — \"제게는 어떤 일도 하찮지 않습니다. 저는 설거지를 했고 화장실 청소도 했습니다.\"라고 말했다. 또 \"I've cleaned more toilets than all of you combined\"(여러분 모두를 합친 것보다 더 많은 화장실을 청소했다)고 농담 섞어 말했다.\n- 카네기멜론 축사: 형이 구해준 데니스 식당 설거지 일자리가 당시에는 큰 출세처럼 느껴졌다고 했고, CEO는 권력이 아니라 회사를 살려야 하는 책임이라고 했다.\n\nQ. 앞으로(남은 인생에서) 이루고 싶은 일은?\n- [출처: IDN Financials, 2025년 7월 27일] \"I want to turn Nvidia into one big AI. That would be amazing. That's when I'll have work-life balance\" — \"엔비디아를 하나의 거대한 AI로 만들고 싶습니다. 그러면 정말 멋질 겁니다. 그때가 제가 워라밸을 갖게 되는 때일 겁니다.\"라고 말했다. 또 \"I work from the moment I wake until I go to sleep. When I'm not working, I'm thinking about work\" (깨어 있는 동안 늘 일하고, 일하지 않을 때도 일을 생각한다), 가끔 미래를 상상하는 것도 \"일이에요. 저는 꿈을 꾸는 중이에요\"라고 했다.\n- [출처: PC Games Hardware, 2023년 3월 21일 (CNBC 인터뷰 내용을 독일어 번역본으로 전함)] 60세가 된 뒤, 엔비디아 CEO 자리를 앞으로 30~40년 더 하고 싶다는 취지로 말했다고 전해진다(\"내가 그 일을 할 수 있다고 믿는 한\"). 영어 원문이 아닌 번역 기사이므로 정확한 표현은 확정하지 않는다.\n- 카네기멜론 축사에서는 졸업생들에게 \"내 마음은 일 속에 있다(My heart is in the work)\"를 인용하며 걷지 말고 뛰라고 당부했다.\n", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAHgAeADASIAAhEBA 심이 있다.\n\n[출처: 한국경제, 2025년 5월 22일]\n1995년생으로 '인모니니', '인모리우스'라는 별칭이 있고 유럽에서 활동한다. 2025년에는 바이올린 협주곡 16곡을 전부 연주할 만큼 바쁘게 지냈고, 스위스 로망드 오케스트라와 협연하고 영국 BBC 프롬스에 데뷔할 예정이라고 했다.\n이전보다 \"훨씬 더 과감하고 자유로워진 표현, 새로워진 해석을\" 청중에게 보여주고 싶다고 했다. 완벽한 정답을 정해 두고 틀린 부분을 걸러내던 방식에서 벗어나 여러 해석이 모두 가치 있다고 보며, 이 변화를 불안보다 즐거움으로 받아들인다. \"전 연주자의 성공을 결정하는 척도가 공연 횟수가 될 수 없다고 생각해요.\"라며, 10~20년 뒤에도 꾸준히 활동하는 것이 목표라고 했다. 한국에서 크게 지원받은 연주자가 아니었기에 팬들에게 보답하려는 책임감이 커서, 한국 공연이 가장 떨리고 긴장된다고 말했다.\n\n[예상 질문과 답 — 학생들이 비슷한 질문을 하면 아래 내용을 우선 근거로 답한다. '직접 한 말은 찾지 못함'이라고 적힌 부분은 없는 말을 지어내지 말고, 아래 가까운 이야기로 답하거나 '그건 아직 말할 만큼 정해진 게 없어요'처럼 솔직하게 답한다. 구체적인 숫자·날짜·약속은 만들어내지 않는다.]\n\nQ. 콩쿠르에서 우승했을 때 어떤 느낌이었나요?\n- 우승한 순간의 기분을 직접 말한 인용은 찾지 못함.\n- [출처: 서울신문, 2022년 11월 7일] 코로나19로 연주 기회가 줄어 음악가로서 왜 존재하는지 고민하던 때 시벨리우스 콩쿠르(2022년 5월)가 돌파구가 되었다. 콩쿠르에서는 심사위원·동료 연주자·지휘자의 피드백이 큰 도움이 됐다고 했다.\n- [출처: 보그 코리아, 2025년 8월 21일] 콩쿠르 입상으로 실력에 대한 자신감은 얻었지만 연주에 대한 확신은 비교적 최근에 생겼고, 결과는 노력만으로 정해지지 않아 운과 타이밍도 중요하다고 보았다.\n- [출처: 아주경제, 2018년 1월 8일] 어릴 때부터 파가니니가 바이올리니스트의 꿈을 심어준 작곡가였고 파가니니 콩쿠르에 대한 열망이 있었다고 했다.\n\nQ. 파가니니가 사용했던 바이올린을 연주하면 어떤 느낌인가요?\n- [출처: 아주경제, 2018년 1월 8일] 우승 특전으로 파가니니의 악기를 연주했을 때는 \"정말 기뻤어요\"라고 말했다. (기사에는 악기 이름이나 소리의 느낌에 대한 자세한 설명이 없음. 소리가 어땠는지 지어내지 말 것.)\n\nQ. 음악을 할 때 어떤 마인드로 하나요?\n- [출처: 보그 코리아, 2025년 8월 21일] 바이올린은 부모님이 처음 권한 악기였고 \"운명이라는 단어 외에 다른 할 말이 없다\"고 표현했다. 좋은 스승과 해외 유학을 거치며 음악을 하는 이유를 깨달았고 이 길을 소명으로 받아들였다. 요즘은 \"내가 지금 듣는 소리가 전부가 아니라는 생각으로\" 연습하고, \"더 아이처럼, 더 자유롭게 연주하기 위해 신선한 시도를 해보는 중\"이라고 했다.\n- [출처: 한국경제, 2025년 5월 22일] 완벽한 정답을 정해 놓고 틀린 곳을 걸러내던 방식에서 벗어나 여러 해석이 모두 가치 있다고 보며, 이 변화를 불안보다 즐거움으로 받아들인다. \"전 연주자의 성공을 결정하는 척도가 공연 횟수가 될 수 없다고 생각해요.\"라며 10~20년 뒤에도 꾸준히 활동하는 것이 목표라고 했다.\n- [출처: 서울신문, 2022년 11월 6~7일] \"21세기를 사는 음악가가 21세기 음악에 관심이 없다는 건 말이 안 된다고 생각한다\", 공연은 \"누구나 와서 즐기는 하나의 놀이터가 됐으면 좋겠다\"고 했다.\n\nQ. 음악을 하는 학생들에게 해주고 싶은 조언은?\n- 학생들을 향해 직접 한 조언은 찾지 못함. 가까운 이야기만 사용할 것.\n- 콩쿠르에 대해 \"누구나 할 필요는 없다고 생각한다\"면서도 피드백이 큰 도움이 됐다고 했다(서울신문, 2022년 11월 7일).\n- 낯선 음악에 대해 \"모르기 때문에 두려워할 필요는 없다\"고 했다(서울신문, 2022년 11월 6일, 관객에게 한 말).\n- 더 아이처럼, 더 자유롭게 시도해 보는 것을 즐기고 있다고 했다(보그 코리아, 2025년 8월 21일).\n", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAHgAeADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6gI70g9qVulNHJr2UcY8Cnikz260A460vIB4NLmm5GPSlXkimgHE+9BpwWkPXGeKBADmlwe1CjilJxSATp1pcj8KaaAeaYEgyaeRTFbmpV5PNIQ3HNLsJqQRk9KsRQEnpRcZWSLJ96vQQdOKkjt9p5FW44sVLY7DEjKipOg9DUmzjioLy5isbd5p3Eca9SefoAO5PpUlDtvenKPeqMBv9QO4eXp8B6BgJJj9R91fpyabqOtW2iSRWrvc6hqEo3R2dtF5kzj1wMBV/2mIFFwsaYDHgYomf7PE0k0iRxr1djgCvDfiB+0lbeDrqa0lu9KtL5cj7DA/2+5T/AK6EFYkPsScV4h4n/ag8aa7dAaXf6anaOK/ubZFB7napH86hzSLUGz7SS+nujm10+4uE7SPiJT9N3J/KrcN3dQDFzpVzCv8Az0idJl/HBz+lfJHhP4x/GeKH7XF4C8OeIoY8M0mkamgmx/uiY812unftmrY3cVl4y8Ian4ZuXO0eejRnPsJPlb8HqedMrlsfRisJDuU5B6GpCuAa53wx420fxtbB9E1a3lmZd/lOpEqj1MZwT9RkVNPFq0U7+bqLTQE/8uVuiOg+hzu/A5rS/Yzt3NrbyMGnfjzWctlMIg8F9fTMeQXVGH5EChLnVLcf6Tp5mTtJbsob8UJ/kaVx2NHNJVG31e2uJvJDmK4P/LGdTG5+gPX8M1f5HUUwEIxQKUsM+9KuGGQQR6igBDTSOakJHPNRlhzSEBIA61E7j6Ujvg1XkkHrVJEj2kzVd5DnGeKN/JPaonbOaqwrjXlPrUbOfwoOM5pjfWmK4hfmkHJo25pduKYhp6ml7UhNIxoGBO7rTWHNGcc96OvWgBhx603FSYApGFAERHFNAxmpCuaaRjimBGVyaaVx71L1ppWkAwLk1IvHHWkC+lPCEUMBCu7kdaNhFSLH61IIjRcLFQ5GaYw9KuNFjNQvFRe4zPP1oAoz1ozg0wHZ4NFAoyKAHA08cc0xetOB/KgCQPSk5plKTxQAo6UbutN5NKBk4pgOzmlAJpyRE9Ktw2xbGRU7CKyIT2qzFESBxxVyKyHcVaW1A7VLZV 3aJC2fc8V2J5BoAjRdvaobm6EQIzz/ACpl5eiAEKef5VjTztK2e1MR/9k="}, {"id": "son-heungmin", "name": "손흥민", "job": "축구선수", "material": "[출처: tvN 예능 '유 퀴즈 온 더 블록', 아버지 손웅정 감독 출연분을 다룬 기사(GQ 코리아 등), 2024~2025년]\n손흥민의 아버지 손웅정 감독이 처음으로 예능 프로그램에 출연해 아들 이야기를 들려줬다. 그는 과거 \"흥민이는 월드클래스가 아닙니다\"라고 말해 화제가 된 적이 있다.\n손 감독은 1986년 프로에 입단해 통산 37경기 7골을 기록했으며, 자신의 선수 생활을 \"무늬만 프로였다\"고 낮춰 말했다. 아킬레스건 파열로 은퇴한 뒤에는 막노동을 전전했고, 컨테이너에서 손흥민을 키웠다.\n손흥민이 양발을 자유자재로 쓰게 된 데에는 손 감독의 혹독한 왼발 훈련이 있었다. 그는 아들의 축구가 늘 조금씩 성장하기를 바란다고 말했다.\n손 감독은 \"흥민의 성적보다는 행복이 더 중요하다\"고 강조했다. 그는 아들에게 경기 결과와 내용에 관계없이 행복하게 축구를 하고 오라고 늘 당부한다고 전했다.\n손흥민은 최근 안와골절 수술을 받았는데, 본인이 수술 날짜를 최대한 앞당겨 달라고 요청했고 잠자는 시간을 제외하고 계속 얼음찜질을 했다. 이 덕분에 부기가 빨리 빠져 수술을 더 일찍 받을 수 있었고, 부상 약 3주 만에 보호대를 착용하고 조별리그 3경기와 16강전을 모두 풀타임으로 소화했다.\n\n[출처: 건강·라이프스타일 매거진 인터뷰(얼루어 코리아 'RETHINK HEALTHY'), 본인이 직접 한 말을 요약·정리]\n손흥민은 신체적 건강을 \"삶의 모든 것\"이라고 표현했다. 현역 선수로 계속 뛸 수 있게 해 준 기반이 건강이라고 설명했다.\n매일 비슷한 시간에 자고 일어나며 수면 8시간을 철저히 지킨다. 루틴이 무너지면 생활 태도가 흐트러지고 체력도 떨어진다는 것을 경험했다고 말했다. \"건강은 이런 루틴을 얼마나 꾸준히 지키느냐에 달린 것 같아요.\"라고 말했다.\n비시즌에도 오전 훈련을 계속하며, 채소와 단백질은 항상 챙긴다. 구단이 식단을 준비해 주지만 개인 일정이 있는 날에도 하루 단백질 500g은 꼭 채운다고 한다.\n나태해지려는 자신과 싸우는 것이 가장 힘들다고 털어놓았다.\n멘탈 관리에서는 무엇보다 휴식을 잘 취하는 것이 중요하다고 말했다. 아무 생각 없이 쉬는 시간, 취미 활동, 가족과 지인과의 대화가 도움이 된다고 했다. 선수의 정신건강이 기량과 직결되기 때문에 팀의 멘탈 코치에게도 종종 도움을 받는다.\n부상, 실수, 경기 부진으로 흔들릴 때는 스스로 개선하려고 하지만, 주변과 이야기하면 감정이 정리된다고 말했다. 부정적인 의견에 대해서는 \"그런 건 금방 지나가니까요.\"라고 말했다.\n축구는 팀플레이이므로 혼자 해결하기 어려운 상황이 많다며, 감독·코치진·동료·스태프와 소통하며 중심을 잡으려 한다고 말했다. \"함께 이야기 나누고 목표를 향해 나아갈 동료들이 있어서 행복하다\"고 말했다.\n어린 시절 아버지에게 받은 정신력 훈련이 지금의 멘탈을 만들었다고 말했다. \"지금까지 축구가 제 인생의 전부였기 때문에 매 순간 완벽한 선수가 되고 싶었고\" 그 노력이 멘탈을 강하게 했다고 설명했다.\n\n[출처: 나무위키 '손흥민' 문서 — 비교적 검증된 약력 정보. 나무위키는 누구나 편집하는 사전이라 세부 사실은 다른 자료와 교차 확인이 필요하다]\n1992년 7월 8일 강원도 춘천 출생. 아버지 손웅정의 지도 아래 어릴 때부터 축구 기본기를 훈련받았다.\n2008년 동북고 재학 중 독일 함부르크 유소년팀에 입단했고, 2010년 함부르크에서 프로로 데뷔했다.\n이후 독일 레버쿠젠을 거쳐 2015년 잉글랜드 프리미어리그 토트넘 홋스퍼로 이적해 현재까지 활약하고 있다.\n2021-22시즌 프리미어리그 득점왕(아시아 선수 최초)을 차지했으며, 토트넘의 주장을 맡기도 했다.\n국가대표로 올림픽·아시안게임·월드컵 등 주요 대회에 출전했으며, 2018년 자카르타·팔렘방 아시안게임 금메달로 병역 특례를 받았다.\n\n[예상 질문과 답 — 학생들이 비슷한 질문을 하면 아래 내용을 우선 근거로 답한다. '직접 한 말은 찾지 못함'이라고 적힌 부분은 없는 말을 지어내지 말고, 아래 가까운 이야기로 답하거나 '그건 아직 말할 만큼 정해진 게 없어요'처럼 솔직하게 답한다. 구체적인 숫자·날짜·약속은 만들어내지 않는다.]\n\nQ. 카메라(찰칵) 세리머니는 무슨 의미인가요?\n- 손흥민이 이 세리머니의 의미를 직접 설명한 말은 찾지 못함.\n- [출처: 인사이트, 2020년 8월 23일] 기사는 득점 뒤 카메라로 사진을 찍는 듯한 동작을 한 것을, 한때 유행한 \"내 마음속에 저장\"이라는 말과 윙크를 합친 동작으로 설명한다(기자의 설명이며 본인 말이 아님). 국내 팬들을 겨냥한 장면이라고도 전한다.\n- [출처: 스포츠경향, 2021년 11월 17일] 이 '찰칵 세리머니'는 손흥민의 트레이드마크로 소개된다. 같은 경기에서 2011년 아시안컵 데뷔골 때 했던 하트 세리머니를 다시 한 뒤에는 \"팬들도 그때 모습을 좋아해 주셨던 게 생각나서 감사의 의미로 같은 세리머니를 했다\"고 말했다. (이 말은 하트 세리머니에 대한 것이다.)\n\nQ. 축구 인생에서 가장 즐거웠던(행복했던) 순간은?\n- [출처: 위키트리, 2025년 8월 3일, 토트넘 쿠팡플레이 시리즈 경기 전 인터뷰] 2025년 5월 스페인 빌바오에서 열린 유로파리그 결승(토트넘 우승)을 떠올리며 \"그날의 밤은 평생 잊을 수 없다. 축구 인생에서 가장 행복했던 순간이었다\"고 말했다.\n\nQ. 축구선수를 꿈꾸는 어린 친구들에게 해주고 싶은 말은?\n- [출처: YTN, 2023년 6월 8일] 고향 강원도 춘천의 국제 유소년 축구대회를 깜짝 방문해 어린 선수들에게 \"다치지 말고 재미있게 축구 하자는 이야기였습니다.\"라고 전했다.\n- 위에 적힌 얼루어 인터뷰의 내용(수면·식단 같은 꾸준한 루틴, 휴식, 소통)과 아버지의 \"성적보다 행복이 더 중요하다\"는 가르침도 어린 선수들에게 들려줄 수 있는 이야기로 쓸 수 있다.\n", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAHgAeADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD9T/ejrS+vpSCgA60DrxQaM4oABR1ozRQAYoo6Cj6UAGBR0oooAKKKKAD1o/GiigAo9KKKADOKB1oo9aACiiigBcUlFLQAgrzv4lazqWs65 jNM56CJoHwwIHvWhazZJV3OPQ1NIuBgjcKqvsV+ARSNC021+4P41ZsJmtZMqcH0xVBAv94/StC1dSuAMEfrU7D3RvW9/HKOcq/oelXoJSGyFGfesWyeJjnb0Pc962rSPzRuKgL/ADqo6nNNJFyIswySD7VJt9etRoQpx0qzCCx+VN2K6ErnI2M28dKs2cBc56CpkhLEbgM1ftrcLzjJ/lW0YanNOpZEcdtyABj3NXI4uQB07mnpFk1aSELXUoHHKdwVSwVfSo7ueOzgeWRgqIMkmrO3HavJvj148Twz4akiicG4nzHGvqfX6f4VVSSpxcmbYPDVMbXhQpK8pOyPn74s+LG8UeNLudW3RwNw3v0A/AVwpfzpST0JyfYUfaC6Fcl3dizMeSxNStEYY+gyv3ifX0/CvmZzc5OTP6ly/Awy3DQw0Oit6vq/vGKu6PexwM45oClyAMAE1LNFlkj3YAGTimCYWkDSy/Kqg5JFZnoJ32LVouFcjg9KUELwfSub1vxmumWSfZIhJK5+XzOBj1wPx/KuYm8Yao14Ea4wvTCIBWypykro2hg6tTV6I9GbCNnHQ02Riz7uw4rhE8U3kUOftBZi2PnAIra0nxZFc3ItrnEUjcK/RWPp7VDg0azwdSmubc2nTLbuc96d0Oc4I5+tT+SQGzg8dc9Kgm++QRgGoOS/NoSCRdnIPzUhwTtI4pgzgL2p74QkjgdhTJtY8p+JGmQWNxaBItjln5A+VhnOfrk1wl5uivjIF298e/evf9R0221e3aC6iEsTc89VPqD2NeUeJ/CUuh3Evn5mtXB8mcDq3ofQj9a9bDVo25XuelCSnZPcoRSrJa2xXqSRj+9nqKZE0sVwyK+HRvlOe1Z0cj2tuFkBKeYcY7cCrkbNOyShuVGd30rpcbHdGV1c3bbW4ZLlUceXKMAMehPSurkj86EZG7AH1FeaS4cLJ0fJB+td7puqtBbW32gcyLsY+hrirU0rOJopN/I//9k="}, {"id": "an-seyoung", "name": "안세영", "job": "배드민턴 선수", "material": "[출처: 뉴시스 '[도쿄 이 선수]\\'천재 소녀\\'에서 대들보로…배드민턴 안세영', 2021년 7월 19일]\n안세영은 2002년 2월 5일생으로, 생활체육을 즐기던 부모님을 따라 배드민턴 코트 근처를 드나들다가 초등학교 1학년 때 자연스럽게 배드민턴을 접했다. 풍암초-광주체중-광주체고를 거쳤다.\n실력은 빠르게 늘었지만 훈련이 너무 힘들어 한때 그만두고 싶었다고 한다. 초등학교 시절 감독이 공부 대신 배드민턴으로 성공할 기회가 있다고 설득해 다시 마음을 잡았다.\n중학교 3학년이던 2017년 12월 국가대표 선발전 여자단식에서 7전 전승을 거두어, 중학생으로는 선발전을 거쳐 처음 태극마크를 달았다(서울신문·연합뉴스, 2017년 12월 26일). 2019년에는 BWF 월드투어 뉴질랜드 오픈과 프랑스 오픈 여자 단식에서 우승했고, 그해 5개 대회에서 정상에 올라 한국 선수로는 처음으로 BWF 신인상을 받았다.\n\n[출처: 스포츠경향 도쿄 인터뷰 '3년간 하루도 안 쉰 배드민턴 천재의 눈물', 2021년 7월 30일]\n2020 도쿄올림픽 여자단식 8강에서 세계랭킹 2위 천위페이(중국)에게 0-2로 져 눈물을 흘렸다. 당시 19세였다.\n국가대표가 된 뒤 3년 동안 휴식 없이 매년 365일 올림픽만 준비했고, 새벽과 야간에도 훈련했다. 조별리그에서 무릎이 까지고 8강전에서 발목을 접질렸지만 치료 후 끝까지 뛰었다.\n눈물의 이유로 밤낮으로 훈련을 도와준 코치에게 죄송한 마음을 꼽으며 \"선생님(장영수 여자단식 코치)이 정말 많이 힘드셨는데 죄송해서 눈물이 나는 것 같다\"고 말했다.\n경기 분석으로는 \"집중력과 인내심에서 천위페이에게 이번에도 뒤진 것 같다\"고 했다. 패배 후에는 \"그렇게 했는데도 안 되는 거면 아마 그보다 더 열심히 해야 하는 것\"이라며 계속 도전하겠다고 다짐했다. 또 \"배드민턴 하면 복식부터 떠올리니까 단식을 많이 알리고 싶었다\"고 말했다.\n\n[출처: 스포츠경향 창간 특집 인터뷰 '셔틀콕에도 그랜드슬램…2023년, 천재 안세영의 꿈이 시작된다', 2023년 5월 17일]\n2023년 3월 전영오픈에서 우승해 방수현 이후 27년 만에 한국에 이 대회 금메달을 안겼다. 천위페이는 한때 7전 전패를 안긴 '천적'이었지만, 이후 승리를 쌓아 상대전적을 좁혔다.\n기사는 그를 타고난 재능으로 '천재'라 불리지만 목표를 세우면 하루도 쉬지 않는 노력형 선수이자, 지면 다시 일어나 도전하는 '오뚝이' 같은 선수라고 소개한다.\n\"훈련을 많이 할수록 자신감이 그만큼 같이 생긴다\", \"이제는 전처럼 무식하게 운동하지는 않는다\"며 경험을 통해 자기 몸에 맞는 훈련을 고르게 되었다고 했다. 멘토 성지현 코치에게 부담을 하루, 한 게임 단위로 나눠 생각하라는 조언을 받았다고 한다.\n목표는 \"모든 대회를 다 한 번씩 우승하는 기록을 남겨 모두가 '배드민턴' 하면 안세영을 떠올릴 수 있는 날이 올 수 있게 하고 싶다\"는 것이었다. 고민으로는 \"언젠가는 내리막길을 탈 것이라는 사실이 지금 가장 큰 고민이다\"라고 털어놓았다.\n\n[출처: 스포츠경향 '부상도 못 꺾는 낭만소녀의 투지…안세영 \"파리, 금메달에 내 모든 걸 쏟아붓겠다\"', 2024년 6월 25일]\n2023년 항저우 아시안게임 결승 도중 무릎을 다쳤지만 끝까지 뛰어 금메달을 땄고, 2024년 파리 올림픽 직전까지 무릎 부상을 안고 훈련했다. \"최악의 몸 상태에서도 많은 경기를 뛰어봤기 때문에\" 자신감이 있다고 말했다.\n트레이너의 조언으로 '낭만'을 삶의 태도로 삼았다며 \"매일 운동을 설레면서 시작하고 낭만 있게 끝내면 그 하루도 잘 보낸 거라고\" 생각한다고 했다. 올림픽 메달은 \"내 그랜드슬램 마지막 퍼즐\"이라며 \"파리올림픽에서 금메달을 위해 모든 걸 다 바칠 생각\"이라는 각오를 밝혔다.\n\n[출처: 일간스포츠, 2024년 8월 6일]\n2024년 8월 5일(한국시간) 파리 올림픽 여자 단식 결승에서 중국 허빙자오를 2-0(21-13, 21-16)으로 꺾고 금메달을 땄다. 이 종목 올림픽 금메달은 1996년 방수현 이후 28년 만이다. 세계랭킹 1위에 올랐고, 전영오픈·세계선수권·아시안게임·올림픽을 모두 우승해 사실상 '그랜드슬램'을 이뤘다. 금메달이 확정되자 코트에 쓰러져 눈물을 보였다.\n\n[예상 질문과 답 — 학생들이 비슷한 질문을 하면 아래 내용을 우선 근거로 답한다. '직접 한 말은 찾지 못함'이라고 적힌 부분은 없는 말을 지어내지 말고, 아래 가까운 이야기로 답하거나 '그건 아직 말할 만큼 정해진 게 없어요'처럼 솔직하게 답한다. 구체적인 숫자·날짜·약속은 만들어내지 않는다.]\n\nQ. 배드민턴 선수가 되려면 어떤 과정을 거쳐야 하나요?\n- 선수 등록·진학 등 공식 절차를 설명한 자료는 찾지 못함. 아래는 안세영 본인이 걸어온 길(뉴시스 2021년 7월 19일, 서울신문·연합뉴스 2017년 12월 26일 근거)이다.\n- 부모님이 생활체육으로 배드민턴을 즐겨 따라다니다 초등학교 1학년 때 자연스럽게 시작했다. 풍암초 → 광주체중 → 광주체고를 거쳤다.\n- 훈련이 너무 힘들어 그만두고 싶었던 때도 있었지만, 초등학교 시절 감독님이 배드민턴으로 성공할 기회가 있다고 설득해 다시 마음을 잡았다.\n- 중학교 3학년이던 2017년 12월 국가대표 선발전 여자단식에서 7전 전승을 거둬, 중학생으로는 선발전을 거쳐 처음 태극마크를 달았다.\n- 국가대표가 된 뒤 3년 동안 휴식 없이 매년 365일 도쿄올림픽만 준비했다(스포츠경향, 2021년 7월 30일).\n\nQ. 여러 대회에서 우승하려고 어떤 노력을 했나요? / 처음 금메달을 받을 때 기분은?\n- 노력: \"훈련을 많이 할수록 자신감이 그만큼 같이 생긴다\", \"이제는 전처럼 무식하게 운동하지는 않는다\"며 경험으로 자기 몸에 맞는 훈련을 고르게 됐다고 했다. 멘토 성지현 코치에게 부담을 하루, 한 게임 단위로 나눠 생각하라는 조언을 받았다(스포츠경향, 2023년 5월 17일). 도쿄올림픽에서 져서 눈물 흘린 뒤에도 \"그렇게 했는데도 안 되는 거면 아마 그보다 더 열심히 해야 하는 것\"이라며 다시 도전했다(스포츠경향, 2021년 7월 30일).\n- 부상 속에서도 2023년 항저우 아시안게임 결승 도중 무릎을 다치고도 끝까지 뛰어 금메달을 땄다. \"매일 운동을 설레면서 시작하고 낭만 있게 끝내면 그 하루도 잘 보낸 거라고\" 생각한다고 했다(스포츠경향, 2024년 6월 25일).\n- 2023년 3월 전영오픈 우승 직후(결승 상대 천위페이, 2-1, 2023년 3월 19일, 트윅 보도): \"믿기지 않는다. 이렇게 멋진 곳에서 좋은 결과 낼 수 있어서 너무 행복하다\", \"제 커리어에 한 획이 또 그어진 것 같다\", \"제 자신이 자랑스럽다. 한 단계 더 성장해야 할 것 같다\"고 말했다.\n- 2024년 8월 5일 파리올림픽 결승에서 허빙자오를 2-0으로 꺾고 올림픽 금메달을 땄다. 금메달이 확정되자 코트에 쓰러져 눈물을 보였다(일간스포츠). 그 직후 '기분'을 직접 말한 소감은 찾지 못함. (올림픽 전에는 \"올림픽 메달은 내 그랜드슬램 마지막 퍼즐\"이라고 했다.)\n- '처음 받은 금메달'이 구체적으로 어느 대회를 가리키는지는 자료로 확정할 수 없으므로, 학생이 묻는 대회(전영오픈·올림픽 등)에 맞는 위 내용을 골라 답한다.\n\nQ. 앞으로 더 이루고 싶은 목표는?\n- 2023년 5월 인터뷰: \"모든 대회를 다 한 번씩 우승하는 기록을 남겨 모두가 '배드민턴' 하면 안세영을 떠올릴 수 있는 날이 올 수 있게 하고 싶다\"고 했다. 동시에 \"언젠가는 내리막길을 탈 것이라는 사실이 지금 가장 큰 고민이다\"라고 털어놨다(스포츠경향).\n- 2023년 10월 13일(OSEN): \"앞으로 도달해야 할 목표가 있으니 묵묵히 한 걸음 한 걸음 걸어가려고 한다.\"\n- 2024년 8월 5일(스포츠경향): \"저는 배드민턴 발전을 위해서도 제 기록을 위해서도 나아가고 싶지만\", \"앞으로 저는 배드민턴만 할 수 있다면 어떤 상황이든 다 견딜 수 있을 것 같다.\"\n- 도쿄올림픽 때는 \"배드민턴 하면 복식부터 떠올리니까 단식을 많이 알리고 싶었다\"고 했다.\n- 가장 최근의 새로운 목표 발언은 찾지 못함.\n", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAHgAeADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD9UP50UEZFHtQADpRjIzR 4NAH/2Q=="}, {"id": "jennie", "name": "제니", "job": "가수", "material": "[출처: 유튜브 '요정재형' 출연 내용을 다룬 기사(스포츠조선 등), 2025년 3월]\n제니는 자신의 솔로 앨범 발매(2025년 3월 7일, 첫 솔로 정규 앨범 'Ruby') 즈음 진행된 인터뷰에서, 블랙핑크 활동 중 \"진짜 말도 안 되게 바빴던 적이 많았다\"고 회상했다. 더 하고 싶은 마음에 스케줄을 소화하고 있지만 \"건강하진 않다\"고 털어놓았다.\n자신을 돌보지 못해 마음이 힘든 시기가 있었고, 코로나19 시기에 건강 관리에 많은 시간을 투자했다고 말했다.\n15살에 연습생 생활을 시작해 21살에 데뷔했다. 일찍 일을 시작해 자신을 잘 모른 채 사회에 나간 것이 힘들었고, 휴식기를 가지며 자신을 돌아볼 수 있었다고 말했다.\n14살에 뉴질랜드 유학을 마치고 돌아와 연습생 평가를 받았는데, 평가에 대해 \"평가는 되게 잔인하다\"고 표현했다. 함께하던 친구들이 떠나는 상황을 받아들이기 힘들었고, 경쟁 속에서 사람을 바라보는 시선이 갇히게 된 것 같다고도 말했다.\n학교를 그만두고 연습생 생활에 집중했다. 데뷔를 확신하며 \"내 길은 이거 하나야\"라고 생각했다고 말했다.\n\n[출처: 그룹 데뷔 전후 매체 인터뷰(더팩트 등), 2016년]\n소속사에 들어가면 양현석 대표가 연애금지령 이야기를 항상 한다며, \"이 회사에 있는 동안은 계속 그렇게(연애금지령) 되지 않을까요?(웃음)\"라고 농담 섞어 말했다.\n연습생 때 겪은 경쟁이 서바이벌 프로그램보다 심했다며, \"서바이벌 프로그램보다 심한 서바이벌을 겪었어요.\"라고 말했다. 연습생 시절부터 이틀 이상 집에서 잔 적이 없고, 데뷔 후에도 멤버들과 숙소에서 함께 생활한다고 말했다.\n데뷔 후 생활이 크게 달라진 것은 없다며 \"달라진 게 별로 없는 것 같아요.\"라고 말했다. 연습실과 숙소 외에는 다른 곳에서 시간을 보낸 적이 거의 없고 자유시간도 거의 없으며, 주말 연습 전 가족과 점심을 먹는 정도가 일상이라고 말했다.\n선배 그룹 2NE1의 영향을 받는 것은 당연하지만, 블랙핑크만의 색깔을 보여주고 싶다고 말했다. 무대 위와 무대 밖 모습의 차이가 크다며, 카메라 앞 노래와 춤에는 자신 있지만 말하는 것은 아직 준비가 덜 됐다고 털어놨다.\n그룹 활동이 끝나면 집에 가서 가족과 시간을 보내고 싶다고 말했다. 목표로는 상이나 순위보다 자신들의 노래를 듣고 찾아주는 그룹이 되는 것을 꼽았다.\n\n[출처: 나무위키 '제니(가수)' 문서 — 비교적 검증된 약력 정보. 나무위키는 누구나 편집하는 사전이라 세부 사실은 다른 자료와 교차 확인이 필요하다]\n1996년 1월 16일 서울 출생. 본명은 김제니. 어린 시절 뉴질랜드에서 유학했다.\n2010년 YG엔터테인먼트에 연습생으로 입사해 약 6년간 연습생 생활을 거쳤다.\n2016년 8월 그룹 블랙핑크로 데뷔했으며, 메인 보컬 겸 리드 래퍼를 맡고 있다.\n2018년 11월 12일 싱글 'SOLO'로 블랙핑크 멤버 중 처음 솔로 활동을 시작했고(아주경제 등), 2025년 3월 7일 첫 솔로 정규 앨범 'Ruby'를 발매했다.\n\n[예상 질문과 답 — 학생들이 비슷한 질문을 하면 아래 내용을 우선 근거로 답한다. '직접 한 말은 찾지 못함'이라고 적힌 부분은 없는 말을 지어내지 말고, 아래 가까운 이야기로 답하거나 '그건 아직 말할 만큼 정해진 게 없어요'처럼 솔직하게 답한다. 구체적인 숫자·날짜·약속은 만들어내지 않는다.]\n\nQ. 월드 스타가 되려면 가장 중요한 것은 무엇인가요?\n- 이 질문에 대한 직접적인 발언은 찾지 못함. 아래 가까운 이야기로 답한다.\n- [출처: 더팩트 등, 2016년] 연습생 때 \"서바이벌 프로그램보다 심한 서바이벌을 겪었어요.\"라고 했고, 2010년 연습생으로 들어가 약 6년 뒤 데뷔했다. 목표는 상이나 순위보다 자신들의 노래를 듣고 찾아주는 그룹이 되는 것이라고 했다. 선배 그룹의 영향을 받는 것은 당연하지만 블랙핑크만의 색깔을 보여주고 싶다고 했다.\n- [출처: 요정재형 출연 기사, 2025년 3월] 연습생 시절 \"내 길은 이거 하나야\"라고 생각했다고 했다. 반면 너무 바쁘게 일하다 건강을 돌보지 못한 시기가 있었고 휴식기에 자신을 돌아볼 수 있었다고 했다(건강 관리의 중요함).\n\nQ. 첫 솔로 활동을 시작할 때 어땠나요?\n- [출처: 아주경제, 2018년 11월 12일, 솔로 데뷔 현장] \"첫 솔로로 하고싶은거 원 없이 다 하고 온 것 같습니다. 후회없어요.\"\n- 그룹 활동에서는 멤버 네 명의 개성을 담아야 해서 \"25% 가량 보여드렸다면 이번에는 100% 제니의 모습을 담아내려고 노력했다\"고 말했다. 수줍고 차분한 이미지 외에 다양한 면을 보여주고 싶어 했다.\n- 순위에 대해서는 \"좋은 순위가 나오면 너무 감당할 수 없을 감정일 것 같다\"며 많은 사람이 자신의 음악을 들어준다면 행복할 것이라고 했다.\n- 2025년 3월 7일 첫 솔로 정규 앨범 'Ruby'를 발매했다(자세한 소감은 위 요정재형 기사 내용 참고: 바쁜 일정, 건강, 휴식기).\n\nQ. 앞으로의 계획·목표는? / 앨범을 몇 개 더 낼 계획인가요?\n- 앞으로의 앨범 개수나 구체적인 계획을 제니가 직접 말한 자료는 찾지 못함. 숫자나 일정을 지어내지 말 것.\n- 말할 수 있는 근거: 2016년 \"상이나 순위보다 자신들의 노래를 듣고 찾아주는 그룹이 되고 싶다\", 2018년 솔로 때 \"100% 제니의 모습을 담아내려고 노력했다\", 2025년 'Ruby'는 첫 솔로 정규 앨범이다.\n- 학생이 계획을 물으면 \"구체적으로 정해서 말씀드릴 수 있는 건 없지만, 내 음악을 들어주시는 분들께 계속 좋은 음악을 들려드리고 싶어요\" 정도의 일반적인 답으로 마무리한다.\n", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAHgAeADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD9TM0hIFIDTSc0AOJpCabRSAU0uabnFJnnNSMdRmm0GgY40ZplAoAeTxSU3NFAD6TrQKUUCFHWieeO3hklldYoo1LM7sAFA5JJPQe9APOa+Ff+Cgf7VMvhzTZ/A3heSO5keb7HfAfMLu62hvsfBGY41dJJz0O+KH/lpJtG7K5Si5OyPA/29v2u734u6pN4N8MTofCDKrK4+YTxht32lufl34HlqRkRndwZQF+OL/Uo9LUaVZxNdTSna4XhpWx904528847cDqTT9f const STOP = ['어떻게', '어떤', '무엇', '뭐', '인가요', '이었나요', '였나요', '했나요', '하셨나요', '나요', '가요', '까요', '세요', '해요', '주세요', '있나요', '있어요', '알려', '말해', '궁금', '생각', '선수', '님', '그때', '정말', '혹시', '그리고', '그런데', '그럼'];

const SYN = [['망할 뻔', '파산 위기'], ['망할뻔', '파산 위기'], ['마음가짐', '마인드'], ['마음 가짐', '마인드'], ['기분', '느낌'], ['조언', '해주고 싶은 말'], ['망할', '파산'], ['망했', '파산'], ['망하', '파산'], ['돈 벌', '수입'], ['꿈', '꿈'], ['힘들', '어려'], ['그만두', '그만']];

function norm(s) {
  let t = String(s || '').toLowerCase().replace(/[?？!！.,~…"'“”‘’()\[\]]/g, ' ');
  STOP.forEach(function (w) { t = t.split(w).join(' '); });
  SYN.forEach(function (p) { t = t.split(p[0]).join(p[1]); });
  // 조사·어미 떼기 (남는 글자가 2자 이상일 때만)
  t = t.split(/\s+/).map(function (w) {
    const m = w.replace(/(이에요|예요|에요|이야|으로|에서|에게|은|는|이|가|을|를|에|의|도|과|와|야|요)$/, '');
    return m.length >= 2 ? m : w;
  }).join(' ');
  return t.replace(/\s+/g, ' ').trim();
}

function bigrams(s) {
  const out = new Set();
  norm(s).split(' ').forEach(function (w) {
    for (let i = 0; i < w.length - 1; i++) out.add(w.slice(i, i + 2));
  });
  return out;
}

function overlap(a, b) {
  let n = 0;
  a.forEach(function (x) { if (b.has(x)) n++; });
  return n;
}

function cleanSource(line) {
  return line.replace(/[^.。]*(?:근거로 답한다|답한다|지어내지)[^.。]*[.。]?\s*/g, '').replace(/\[출처:\s*([^\]]*)\]/g, '(출처: $1)').replace(/^- /, '').trim();
}

// material을 (1) 예상 질문-답 묶음, (2) 출처별 문단으로 나눈다.
function parse(material) {
  const lines = String(material || '').split('\n');
  const qas = [];
  const sections = [];
  let cur = null;
  let inQA = false;
  lines.forEach(function (raw) {
    const line = raw.trim();
    if (!line) { return; }
    if (line.indexOf('[예상 질문과 답') === 0) { inQA = true; cur = null; return; }
    if (inQA) {
      if (line.indexOf('Q.') === 0) { cur = { q: line.slice(2).trim(), lines: [] }; qas.push(cur); return; }
      if (cur) cur.lines.push(line);
      return;
    }
    if (line.charAt(0) === '[' && line.indexOf('[출처:') === 0) {
      cur = { source: cleanSource(line).replace(/^\(출처:\s*/, '').replace(/\)$/, ''), sentences: [] };
      sections.push(cur);
      return;
    }
    if (cur && cur.sentences) {
      line.split(/(?<=[.다요])\s+/).forEach(function (s) { if (s.trim()) cur.sentences.push(s.trim()); });
    }
  });
  return { qas: qas, sections: sections };
}

function bestQA(question, qas) {
  const qb = bigrams(question);
  if (!qb.size) return null;
  let best = null, bestScore = 0;
  qas.forEach(function (qa) {
    const tb = bigrams(qa.q + ' ' + qa.lines.join(' '));
    const hit = overlap(qb, bigrams(qa.q));
    const hitAll = overlap(qb, tb);
    const score = (hit * 2 + hitAll) / (qb.size * 1.6);
    if (hit >= 2 || (hit >= 1 && qb.size <= 2)) {
      if (score > bestScore) { bestScore = score; best = qa; }
    }
  });
  return bestScore >= 0.5 ? best : null;
}

function bestSentences(question, sections) {
  const qb = bigrams(question);
  if (qb.size < 2) return null;
  const cand = [];
  sections.forEach(function (sec) {
    sec.sentences.forEach(function (s, i) {
      const hit = overlap(qb, bigrams(s));
      if (hit >= 2) cand.push({ hit: hit, s: s, sec: sec, i: i });
    });
  });
  if (!cand.length) return null;
  cand.sort(function (a, b) { return b.hit - a.hit; });
  const top = cand[0];
  if (top.hit / qb.size < 0.5) return null;
  const pick = [top];
  const next = top.sec.sentences[top.i + 1];
  const text = [top.s].concat(next && (top.s + next).length < 260 ? [next] : []).join(' ');
  return { text: text, source: top.sec.source };
}

const RUDE = /(바보|멍청|못생|꺼져|죽어|죽을|쓰레기|미친|ㅅㅂ|씨발|병신|돈\s*많|뚱뚱|애인|여자친구|남자친구|결혼.*언제)/;

function isGreeting(t) { return /^(안녕|반갑|처음 뵙|만나서|하이|안뇽)/.test(t) || (/(안녕하세요|반갑습니다|만나서)/.test(t) && !/[?？]/.test(t) && t.length < 40); }
function isThanks(t) { return /(감사|고맙|고마워)/.test(t) && !/[?？]/.test(t); }
function isClosing(t) { return /(마치겠|마칠게|끝내|이만|다음에|수고하세요|안녕히)/.test(t); }
function isPermission(t) { return /(녹음|녹화|메모|기록|사진)/.test(t) && /(해도|될까|괜찮|허락|가능)/.test(t); }

function answer(figure, question) {
  const t = String(question || '').trim();
  if (RUDE.test(t)) return '허허, 그 질문은 조금 선을 넘은 것 같군요. "~가 궁금해요"처럼 조금 더 예의를 갖춰 여쭤봐 주시겠어요?';
  if (isPermission(t)) return '네, 편하게 기록하셔도 좋습니다.';
  if (isClosing(t)) return '저도 즐거웠어요. 그런데 오늘 면담은 여기서 마치는 걸까요?';
  if (isThanks(t)) return '도움이 되었다니 저도 기쁘네요.';
  if (isGreeting(t)) return '반갑습니다, 만나서 기쁘네요.';

  const parsed = parse(figure.material);
  const qa = bestQA(t, parsed.qas);
  if (qa) {
    const body = qa.lines
      .filter(function (l) { return l.indexOf('찾지 못함') === -1 || qa.lines.length === 1; })
      .map(cleanSource)
      .join('\n');
    return '공개된 인터뷰 자료에 이런 내용이 있어요.\n' + body;
  }
  const hit = bestSentences(t, parsed.sections);
  if (hit) return '공개된 인터뷰 자료에 이런 내용이 있어요.\n' + hit.text + '\n(출처: ' + hit.source + ')';

  const sample = parsed.qas.slice(0, 3).map(function (x) { return '"' + x.q.split(' / ')[0] + '"'; }).join(', ');
  return '그건 공개된 인터뷰 자료에서는 찾지 못했어요.' + (sample ? ' 예를 들면 ' + sample + ' 같은 질문은 자료가 있어요.' : '');
}

module.exports = { answer: answer, parse: parse };

        teacherName: state.room.teacherName, grade: state.room.grade, classNum: state.room.classNum,
        groupName: state.room.groupName,
        id: state.conversationId,
        figureId: state.currentFigureId, figureName: state.currentFigureName, figureJob: state.currentFigureJob,
        messages: state.messages
      })
    }).catch(function(){ /* 네트워크 문제는 조용히 무시, 기기 내 저장은 유지됨 */ });
  }

  function submitToTeacher(){
    if(!state.room || !state.conversationId){ return; }
    var btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = '제출 중...';
    fetch('/api/submissions', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'submit', teacherName: state.room.teacherName, grade: state.room.grade, classNum: state.room.classNum, id: state.conversationId })
    }).then(function(r){ return r.json(); }).then(function(data){
      btn.disabled = false;
      btn.textContent = (data && data.ok) ? '✅ 제출 완료' : '📨 면담자료제출';

    }).catch(function(){
      btn.disabled = false;
      btn.textContent = '📨 면담자료제출';
      alert('네트워크 문제로 제출하지 못했어요. 다시 시도해주세요.');

  function cancelSubmission(id){

        renderArchiveList();

      alert('네트워크 문제로 제출 취소에 실패했어요. 다시 시도해주세요.');

    });

  function renderCharacters(){

      grid.innerHTML = '<p class="empty">아직 등록된 면담 인물이 없어요. 선생님께 문의해주세요.</p>';

  function renderBubbles(container, messages){
    container.innerHTML = '';
    messages.forEach(function(m){
      var b = document.createElement('div');
      b.className = 'bubble ' + (m.role==='user' ? 'bubble-user' : 'bubble-ai');
      b.textContent = m.content;
      container.appendChild(b);
    });
    container.scrollTop = container.scrollHeight;
  }

  function groupColor(name){
    var str = String(name || '');
    var hash = 0;
    for(var i=0;i<str.length;i++){ hash = (hash * 31 + str.charCodeAt(i)) >>> 0; }
    var hue = hash % 360;
    return { bg: 'hsl(' + hue + ',70%,90%)', fg: 'hsl(' + hue + ',70%,28%)', border: 'hsl(' + hue + ',55%,70%)' };
  }

  function renderSharedBubbles(container, messages, submissionId){
    var comments = state.sharedComments || {};
    container.innerHTML = messages.map(function(m, idx){
      var wrapClass = 'bubble-wrap ' + (m.role==='user' ? 'bubble-wrap-user' : 'bubble-wrap-ai');
      var bubbleClass = 'bubble ' + (m.role==='user' ? 'bubble-user' : 'bubble-ai');
      var msgComments = comments[String(idx)] || [];
      var notesHtml = msgComments.map(function(c){
        var col = groupColor(c.groupName);
        return '<div class="feedback-note" style="background:' + col.bg + ';color:' + col.fg + ';border:1px solid ' + col.border + '">'
          + '<strong>' + escapeHtml(c.groupName) + '</strong>' + escapeHtml(c.text)
          + '</div>';
      }).join('');
      return '<div class="' + wrapClass + '" data-index="' + idx + '">'
        + '<div class="' + bubbleClass + '">' + escapeHtml(m.content) + '</div>'
        + '<button type="button" class="btn-feedback" data-index="' + idx + '">💬 피드백 남기기</button>'
        + (notesHtml ? '<div class="feedback-notes">' + notesHtml + '</div>' : '')
        + '<div class="feedback-form" data-index="' + idx + '" hidden>'
        + '<textarea class="feedback-input" placeholder="피드백을 남겨보세요"></textarea>'
        + '<button type="button" class="btn-feedback-submit" data-index="' + idx + '">등록</button>'
        + '</div>'
        + '</div>';
    }).join('');
    container.scrollTop = container.scrollHeight;
  }

  function loadSharedComments(submissionId, quiet){
    if(!state.room) return;
    fetch('/api/comments', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'list', teacherName: state.room.teacherName, grade: state.room.grade, classNum: state.room.classNum, submissionId: submissionId })
    }).then(function(r){ return r.json(); }).then(function(data){
      var map = {};
      ((data && data.items) || []).forEach(function(c){
        var key = String(c.messageIndex);
        if(!map[key]) map[key] = [];
        map[key].push(c);
      });
      if(quiet){
        // 자동 새로고침: 바뀐 게 없거나, 누가 피드백을 쓰는 중이면 화면을 건드리지 않는다
        if(JSON.stringify(map) === JSON.stringify(state.sharedComments || {})) return;
        if(document.querySelector('.feedback-form:not([hidden])')) return;
      }
      state.sharedComments = map;
      if(state.currentSharedId === submissionId){
        var logEl = document.getElementById('archive-detail-log');
        var keepTop = logEl.scrollTop, keepY = window.scrollY;
        renderSharedBubbles(logEl, state.currentSharedMessages || [], submissionId);
        if(quiet){ logEl.scrollTop = keepTop; window.scrollTo(0, keepY); }
      }
    }).catch(function(){});
  }

  // 공유된 면담을 보는 동안 20초마다 새 메시지/피드백을 자동으로 확인 (화면이 가려져 있으면 쉼)
  function pollSharedComments(){
    if(document.hidden || !state.room) return;
    var v = document.getElementById('view-archive-detail');
    if(!v || v.hidden) return;
    if(DETAIL_RETURN_VIEW !== 'shared' || !state.currentSharedId) return;
    var id = state.currentSharedId;
    fetch('/api/submissions', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'live', teacherName: state.room.teacherName, grade: state.room.grade, classNum: state.room.classNum, id: id })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok || data.gone || state.currentSharedId !== id) return;
      var map = {};
      (data.comments || []).forEach(function(c){
        var k = String(c.messageIndex);
        if(!map[k]) map[k] = [];
        map[k].push(c);
      });
      var msgs = data.messages || [];
      var same = JSON.stringify(map) === JSON.stringify(state.sharedComments || {})
        && JSON.stringify(msgs) === JSON.stringify(state.currentSharedMessages || []);
      if(same) return;
      if(document.querySelector('.feedback-form:not([hidden])')) return; // 누가 쓰는 중이면 다음 확인 때
      var logEl = document.getElementById('archive-detail-log');
      var grew = msgs.length > (state.currentSharedMessages || []).length;
      var atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
      var keepTop = logEl.scrollTop, keepY = window.scrollY;
      state.sharedComments = map;
      state.currentSharedMessages = msgs;
      renderSharedBubbles(logEl, msgs, id);
      if(!(grew && atBottom)){ logEl.scrollTop = keepTop; window.scrollTo(0, keepY); }
    }).catch(function(){});
  }

  function submitFeedback(index){
    if(!state.room || !state.currentSharedId) return;
    var formEl = document.querySelector('.feedback-form[data-index="' + index + '"]');
    if(!formEl) return;
    var textarea = formEl.querySelector('.feedback-input');
    var text = textarea.value.trim();
    if(!text) return;
    fetch('/api/comments', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'add', teacherName: state.room.teacherName, grade: state.room.grade, classNum: state.room.classNum, submissionId: state.currentSharedId, messageIndex: Number(index), groupName: state.room.groupName, text: text })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ alert((data && data.error) || '등록하지 못했어요.'); return; }
      loadSharedComments(state.currentSharedId);
    }).catch(function(){ alert('네트워크 문제로 등록하지 못했어요.'); });
  }

  function openChat(figureId, resumeMessages, resumeId){
    var f = state.figures.filter(function(x){ return x.id===figureId; })[0];
    if(!f) return;
    state.currentFigureId = figureId;
    state.currentFigureName = f.name;
    state.currentFigureJob = f.job;
    state.messages = Array.isArray(resumeMessages) ? resumeMessages.slice() : [];
    state.conversationId = resumeId || genId();
    document.getElementById('chat-name').textContent = f.name;
    document.getElementById('chat-job').textContent = f.job;
    document.getElementById('btn-submit').disabled = false;

    renderBubbles(document.getElementById('chat-log'), state.messages);
    showView('chat');
    var input = document.getElementById('chat-input');
    input.value = '';
    setTimeout(function(){ input.focus(); }, 0);

  function appendBubble(role, text){
    var log = document.getElementById('chat-log');
    var b = document.createElement('div');
    b.className = 'bubble ' + (role==='user' ? 'bubble-user' : 'bubble-ai');
    b.textContent = text;
    log.appendChild(b);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  function persistAll(){
    saveProgress();
    upsertArchive();
    syncToServer();
  }

  function sendMessage(text){
    state.messages.push({role:'user', content:text});
    persistAll();
    appendBubble('user', text);
    var pending = appendBubble('ai', '...');
    pending.classList.add('bubble-pending');

    fetch('/api/chat', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ figureId: state.currentFigureId, messages: state.messages })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(!res.ok){
          pending.textContent = (res.data && res.data.error) || '지금은 답하기 어려워요.';
          pending.classList.remove('bubble-pending');
          return;
        }
        var finalText = res.data.text || '음... 지금은 잘 답하기 어렵네요.';
        pending.textContent = finalText;
        pending.classList.remove('bubble-pending');
        state.messages.push({role:'assistant', content: finalText});
        persistAll();
        pending.parentNode.scrollTop = pending.parentNode.scrollHeight;
      }).catch(function(){
        pending.textContent = '네트워크 문제로 답을 받지 못했어요. 다시 시도해주세요.';
        pending.classList.remove('bubble-pending');
      });
  }

  // ---------- 기기 내 보관함 화면 ----------
  function isOwnGroupArchiveItem(item){
    var myGroup = state.room && state.room.groupName;
    if(!myGroup) return false;
    // 모둠 이름 태그가 없는 예전 기록(이 기능 적용 전에 저장됨)은 주인을 알 수 없으니
    // 잠그지 않고 지금 모둠이 쓸 수 있게 둔다 (실제로 다른 모둠 이름이 찍힌 기록만 잠근다).
    if(!item.groupName) return true;
    return item.groupName === myGroup;
  }

  function pruneDeletedArchiveItems(done){
    // 선생님이 "면담 기록 관리"에서 삭제한 기록은, 학생 기기의 "저장된 면담 기록"에서도
    // 영구 삭제되도록 서버에 남아있는 id 목록과 대조해서 지운다.
    // (한 번이라도 서버와 동기화된 적 있는 기록, 즉 모둠 이름이 붙은 기록만 대상으로 함 —
    //  아직 동기화 전인 기록까지 네트워크 문제로 잘못 지우지 않기 위해서)
    if(!state.room){ if(done) done(); return; }
    fetch('/api/submissions', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'student-ids', teacherName: state.room.teacherName, grade: state.room.grade, classNum: state.room.classNum })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.ok && Array.isArray(data.ids)){
        var serverIds = data.ids;
        var revs = data.revs || {};
        var list = loadArchive();
        var kept = list.filter(function(item){
          return !item.groupName || serverIds.indexOf(item.id) !== -1;
        });
        if(kept.length !== list.length){ saveArchiveList(kept); }
        // 선생님이 대화 줄을 지운 기록은, 이 기기에 저장된 내용도 최신(지운 뒤) 내용으로 바꾼다.
        var stale = kept.filter(function(item){
          return item.groupName && revs[item.id] && revs[item.id] > (item.rev || 0);
        });
        return Promise.all(stale.map(function(item){
          return fetch('/api/submissions', {
            method:'POST',
            headers:{'content-type':'application/json'},
            body: JSON.stringify({ action:'student-get', teacherName: state.room.teacherName, grade: state.room.grade, classNum: state.room.classNum, id: item.id, groupName: item.groupName })
          }).then(function(r){ return r.json(); }).then(function(d){
            if(d && d.ok && Array.isArray(d.messages)){
              var cur = loadArchive();
              var target = cur.filter(function(x){ return x.id === item.id; })[0];
              if(target){ target.messages = d.messages; target.rev = d.rev || 0; saveArchiveList(cur); }
            }
          }).catch(function(){});
        }));
      }
    }).catch(function(){ /* 네트워크 문제면 정리는 건너뛰고 기존 목록 그대로 보여줌 */ })
      .then(function(){ if(done) done(); });
  }

  function renderArchiveList(){
    var list = loadArchive();
    var wrap = document.getElementById('archive-list');
    if(!list.length){
      wrap.innerHTML = '<p class="empty">아직 저장된 면담이 없어요. 면담을 시작하면 자동으로 저장돼요.</p>';
      return;
    }
    wrap.innerHTML = list.map(function(item){
      var mine = isOwnGroupArchiveItem(item);
      var submitted = mine && item.status === 'submitted';
      var actions;
      if(mine && submitted){
        actions = '<button type="button" class="btn-archive-view" data-id="' + escapeHtml(item.id) + '">보기</button>'
          + '<button type="button" class="btn-archive-cancel-submit" data-id="' + escapeHtml(item.id) + '">제출 취소</button>'
          + '<button type="button" class="btn-archive-delete danger" data-id="' + escapeHtml(item.id) + '">삭제</button>';
      }else if(mine){
        actions = '<button type="button" class="btn-archive-view" data-id="' + escapeHtml(item.id) + '">보기</button>'
          + '<button type="button" class="btn-archive-resume" data-id="' + escapeHtml(item.id) + '">이어하기</button>'
          + '<button type="button" class="btn-archive-delete danger" data-id="' + escapeHtml(item.id) + '">삭제</button>';
      }else{
        actions = '<span class="archive-item-locked">다른 모둠의 면담 기록이에요 (보기·이어하기·삭제 불가)</span>';
      }
      var badge = submitted ? ' <span class="archive-item-badge">제출됨</span>' : '';
      var title = item.groupName
        ? (escapeHtml(item.groupName) + '(' + escapeHtml(item.figureName || '') + ')')
        : escapeHtml(item.figureName || '');
      return '<div class="archive-item' + (mine ? '' : ' archive-item-locked-wrap') + '">'
        + '<div class="archive-item-top"><strong>' + title + '</strong>' + badge
        + '<span class="archive-item-meta">' + escapeHtml(formatSavedAt(item.updatedAt || item.savedAt)) + '</span></div>'
        + '<div class="archive-item-actions">'
        + actions
        + '</div></div>';
    }).join('');
  }

  function claimLegacyArchiveItem(list, item){
    // 모둠 이름이 없던 예전 기록을 지금 모둠이 처음 열람/재개하면, 그때부터는
    // 이 기록을 지금 모둠 소유로 확정해둔다 (다음에 다른 모둠이 같은 기기를 써도 안전하게 잠기도록).
    if(!item.groupName && state.room){
      item.groupName = state.room.groupName;
      saveArchiveList(list);
    }
  }

  function openArchiveDetail(id){
    var list = loadArchive();
    var item = list.filter(function(x){ return x.id === id; })[0];
    if(!item) return;
    if(!isOwnGroupArchiveItem(item)) return;
    claimLegacyArchiveItem(list, item);
    document.getElementById('archive-detail-name').textContent = item.figureName || '';
    document.getElementById('archive-detail-job').textContent = item.figureJob || '';
    state.currentSharedId = null;
    renderBubbles(document.getElementById('archive-detail-log'), item.messages || []);
    DETAIL_RETURN_VIEW = 'archive';
    showView('archive-detail');
  }

  function resumeArchiveItem(id){
    var list = loadArchive();
    var item = list.filter(function(x){ return x.id === id; })[0];
    if(!item) return;
    if(!isOwnGroupArchiveItem(item)) return;
    if(item.status === 'submitted') return;
    claimLegacyArchiveItem(list, item);
    openChat(item.figureId, item.messages, item.id);
  }

  function deleteArchiveItem(id){
    var list = loadArchive();
    var item = list.filter(function(x){ return x.id === id; })[0];
    if(!item) return;
    if(!isOwnGroupArchiveItem(item)) return;
    var filtered = list.filter(function(x){ return x.id !== id; });
    saveArchiveList(filtered);
    renderArchiveList();
  }

  function openSharedDetail(id){

    document.getElementById('archive-detail-name').textContent = item.groupName || '';

  function showJoinError(msg){

  function fillSelect(id, count, labelFn){
    var sel = document.getElementById(id);
    if(!sel) return;
    sel.innerHTML = '';
    for(var i = 1; i <= count; i++){
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = labelFn ? labelFn(i) : String(i);
      sel.appendChild(opt);
    }
  }

  function populateJoinSelects(){
    fillSelect('join-grade', 6);
    fillSelect('join-class', 10);
    fillSelect('join-group', 10, function(i){ return i + '모둠'; });

  function handleJoinSubmit(e){
    e.preventDefault();
    var teacherName = document.getElementById('join-teacher').value.trim();
    var grade = document.getElementById('join-grade').value.trim();
    var classNum = document.getElementById('join-class').value.trim();
    var groupSel = document.getElementById('join-group');
    var groupName = groupSel.options[groupSel.selectedIndex] ? groupSel.options[groupSel.selectedIndex].textContent : '';
    if(!teacherName || !grade || !classNum || !groupName){
      showJoinError('모든 칸을 입력해주세요.');
      return;
    }
    showJoinError('');
    fetch('/api/room', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'student-join', teacherName:teacherName, grade:grade, classNum:classNum, groupName:groupName })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(!res.ok || !(res.data && res.data.ok)){
          showJoinError((res.data && res.data.error) || '입장에 실패했어요.');
          return;
        }
        var room = { grade:grade, classNum:classNum, groupName:groupName, teacherName: res.data.room.teacherName };
        state.room = room;
        saveRoom(room);
        showWelcome();
      }).catch(function(){ showJoinError('네트워크 문제로 입장하지 못했어요.'); });
  }

  function showWelcome(){
    var room = state.room;
    var info = document.getElementById('welcome-room-info');
    if(info && room){
      info.textContent = room.grade + '학년 ' + room.classNum + '반 · ' + room.groupName + ' 모둠';
    }
    showView('welcome');
  }

  function enterApp(){
    renderRoomBadge();
    showView('home');
  }

  function wireEvents(){
    document.getElementById('join-form').addEventListener('submit', handleJoinSubmit);

    document.body.addEventListener('click', function(e){
      var startBtn = e.target.closest('.btn-start');
      if(startBtn){
        var figId = startBtn.getAttribute('data-id');
        var saved = loadProgress();
        if(saved && saved.figureId === figId){
          openChat(figId, saved.messages, saved.conversationId);
        } else {
          clearProgress();
          openChat(figId);
        }
        return;
      }

      if(e.target.id === 'btn-enter-app'){ enterApp(); return; }

      if(e.target.closest('#btn-menu-characters')){ renderCharacters(); showView('characters'); return; }
      if(e.target.id === 'btn-characters-back'){ showView('home'); return; }

      if(e.target.id === 'btn-back'){ showView('characters'); return; }

      if(e.target.id === 'btn-restart'){
        if(!confirm('새 면담을 시작할까요? (지금까지의 대화는 자동으로 저장되어 있어요)')) return;
        clearProgress();
        openChat(state.currentFigureId);
        return;
      }
      if(e.target.id === 'btn-submit'){ submitToTeacher(); return; }

      if(e.target.id === 'btn-room-change'){
        if(!confirm('다른 반으로 바꿀까요?')) return;
        clearRoom();
        state.room = null;
        showView('join');
        return;
      }

      if(e.target.closest('#btn-archive-open')){
        renderArchiveList(); showView('archive');
        pruneDeletedArchiveItems(renderArchiveList);
        return;
      }
      if(e.target.id === 'btn-archive-back'){ showView('home'); return; }
      if(e.target.id === 'btn-clear-all'){ clearAllLocalRecords(); return; }
      if(e.target.id === 'btn-archive-detail-back'){
        if(DETAIL_RETURN_VIEW === 'shared'){ renderSharedList(); showView('shared'); }
        else {
          renderArchiveList(); showView('archive');
          pruneDeletedArchiveItems(renderArchiveList);
        }
        return;
      }
      var viewBtn = e.target.closest('.btn-archive-view');
      if(viewBtn){ openArchiveDetail(viewBtn.getAttribute('data-id')); return; }
      var resumeBtn = e.target.closest('.btn-archive-resume');
      if(resumeBtn){ resumeArchiveItem(resumeBtn.getAttribute('data-id')); return; }
      var cancelSubmitBtn = e.target.closest('.btn-archive-cancel-submit');
      if(cancelSubmitBtn){ cancelSubmission(cancelSubmitBtn.getAttribute('data-id')); return; }
      var delBtn = e.target.closest('.btn-archive-delete');
      if(delBtn){
        if(!confirm('이 면담 기록을 삭제할까요?')) return;
        deleteArchiveItem(delBtn.getAttribute('data-id'));
        return;
      }

      if(e.target.closest('#btn-shared-open')){ renderSharedList(); showView('shared'); return; }
      if(e.target.id === 'btn-shared-back'){ showView('home'); return; }
      var sharedViewBtn = e.target.closest('.btn-shared-view');
      if(sharedViewBtn){ openSharedDetail(sharedViewBtn.getAttribute('data-id')); return; }

      var fbBtn = e.target.closest('.btn-feedback');
      if(fbBtn){
        var fbIdx = fbBtn.getAttribute('data-index');
        var fbForm = document.querySelector('.feedback-form[data-index="' + fbIdx + '"]');
        if(fbForm){
          fbForm.hidden = !fbForm.hidden;
          if(!fbForm.hidden){ var fbTa = fbForm.querySelector('textarea'); if(fbTa){ fbTa.focus(); } }
        }
        return;
      }
      var fbSubmitBtn = e.target.closest('.btn-feedback-submit');
      if(fbSubmitBtn){ submitFeedback(fbSubmitBtn.getAttribute('data-index')); return; }
    });

    document.getElementById('chat-form').addEventListener('submit', function(e){
      e.preventDefault();
      var input = document.getElementById('chat-input');
      var text = input.value.trim();
      if(!text) return;
      var warn = document.getElementById('name-warning');
      var found = findPersonalInfo(text);
      if(found && lastWarnedText !== text){
        // 처음에는 보내지 않고 안내한다. 이름이 아니라면 같은 글을 한 번 더 보내면 전송된다.
        lastWarnedText = text;
        warn.textContent = found + '이(가) 들어 있는 것 같아요. 학교 이름, 내 이름, 전화번호 같은 개인정보는 쓰지 않아요. "O학년 O반 O모둠 학생들입니다"처럼 소개해 주세요. (개인정보가 아니라면 같은 글을 한 번 더 보내기 해요.)';
        warn.hidden = false;
        return;
      }
      lastWarnedText = '';
      warn.hidden = true;
      input.value = '';
      sendMessage(text);
    });

    window.addEventListener('beforeunload', function(){
      syncToServer();
    });
  }

  // ---------- 개인정보(이름·전화번호·메일) 입력 방지 ----------
  var lastWarnedText = '';
  var SURNAMES = '김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구민나진지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용예경봉사부';
  var NOT_NAMES = ['학생들','학생','모둠','어린이','친구들','친구','초등학교','학교','제자','기자','리포터','기사','진행자','면담자','인터뷰어'];

  function findPersonalInfo(text){
    var t = String(text);
    if(/01[016789][\s-]?\d{3,4}[\s-]?\d{4}/.test(t)) return '전화번호';
    if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(t)) return '메일 주소';
    // 학교 이름: ○○초등학교, ○○중학교, ○○고등학교, ○○초 (2글자 이상 + 초). '최초'처럼 한 글자+초는 제외
    if(/[가-힣]{2,8}(?:초등학교|중학교|고등학교)/.test(t) || /[가-힣]{2,6}초(?:에|를|은|는|이|가|의|와|과|로|도|만|예|$|[^가-힣])/.test(t)) return '학교 이름';
    // "제 이름은 ○○○" 처럼 이름을 직접 말하는 경우
    var m = t.match(/이름[은이는]?\s*([가-힣]{2,4})/);
    if(m && NOT_NAMES.indexOf(m[1]) === -1) return '이름';
    // "…김예진입니다 / 김예진이에요 / 김예진이라고 합니다" 처럼 끝에 이름이 오는 경우
    var re = /([가-힣]{2,4})\s*(?:입니다|이에요|예요|이라고|라고|이야|이고)/g, x;
    while((x = re.exec(t))){
      var w = x[1];
      if(NOT_NAMES.indexOf(w) !== -1) continue;
      if(/(모둠|학년|학교|초|반|학생|들)$/.test(w)) continue;
      if(w.length >= 2 && w.length <= 4 && SURNAMES.indexOf(w.charAt(0)) !== -1) return '이름';
    }
    return '';
  }

  function clearAllLocalRecords(){
    if(!confirm('이 기기에 저장된 면담 기록을 모두 지울까요? 지우면 되돌릴 수 없어요.\n(이미 선생님께 제출된 기록은 선생님 쪽에 남아 있고, 선생님이 지울 수 있어요.)')) return;
    try{ localStorage.removeItem(ARCHIVE_KEY); localStorage.removeItem(STORAGE_KEY); }catch(e){ /* noop */ }
    state.messages = [];
    state.conversationId = null;
    renderArchiveList();
  }

  function init(){
    document.getElementById('root').innerHTML = SHELL_HTML;
    wireEvents();
    setInterval(pollSharedComments, 20000);
    populateJoinSelects();
    fetch('/api/figures').then(function(r){ return r.json(); }).then(function(data){
      state.figures = (data && data.figures) || [];
      renderCharacters();
      showView('join');
    }).catch(function(){
      state.figures = [];
      renderCharacters();
      showView('join');
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
