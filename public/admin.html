<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI가상면담 - 관리자</title>
<style>
body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#F2F4F8;color:#1C2430}
@media (prefers-color-scheme:dark){body{background:#121722;color:#E8ECF2}.card{background:#1B222E!important;border-color:#2E3847!important}}
.wrap{max-width:640px;margin:0 auto;padding:20px}
h1{font-size:1.2rem;margin:0 0 12px}
.card{background:#fff;border:1px solid #E1E5EC;border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta{font-size:.76rem;color:#667085}
button{border:none;border-radius:999px;padding:8px 14px;font-size:.82rem;cursor:pointer;font-weight:700}
.ok{background:#2FA84F;color:#fff}.no{background:#fff;color:#B3432B;border:1px solid #B3432B}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #C9CFDA;width:100%;box-sizing:border-box;margin:6px 0}
.go{background:#D98A2B;color:#fff;width:100%;padding:10px}
.tag{font-size:.72rem;padding:2px 8px;border-radius:999px;margin-left:6px}
.t-pending{background:#FFE8C2;color:#5C3C10}.t-approved{background:#DFF3E4;color:#1F6B35}.t-blocked{background:#FDECEA;color:#B3432B}
.err{color:#B3432B;font-size:.85rem}
h2{font-size:.95rem;margin:18px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>관리자 – 반 사용 승인</h1>
  <div id="login">
    <p class="meta">앱 운영자만 들어올 수 있어요. 관리자 비밀번호를 입력하세요.</p>
    <input id="pin" type="password" autocomplete="off" placeholder="관리자 비밀번호">
    <button id="enter" class="go" type="button">들어가기</button>
    <p id="err" class="err"></p>
  </div>
  <div id="main" hidden>
    <button id="refresh" type="button" class="no" style="color:#667085;border-color:#C9CFDA">↻ 새로고침</button>
    <div id="list"></div>
  </div>
</div>
<script>
(function(){
  var pin = '';
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function api(body){
    body.adminPin = pin;
    return fetch('/api/admin', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); });
  }
  var LABEL = {pending:'승인 대기', approved:'사용 중', blocked:'중지됨'};
  function row(it){
    var btns = it.status === 'pending' ? '<button class="ok" data-k="' + esc(it.key) + '" data-s="approved">승인</button> <button class="no" data-k="' + esc(it.key) + '" data-s="blocked">거절</button>'
      : it.status === 'approved' ? '<button class="no" data-k="' + esc(it.key) + '" data-s="blocked">사용 중지</button>'
      : '<button class="ok" data-k="' + esc(it.key) + '" data-s="approved">다시 승인</button>';
    return '<div class="card"><div><strong>' + esc(it.teacherName) + ' 선생님 · ' + esc(it.grade) + '학년 ' + esc(it.classNum) + '반</strong>'
      + '<span class="tag t-' + it.status + '">' + LABEL[it.status] + '</span><div class="meta">신청 ' + esc((it.createdAt || '').slice(0, 16).replace('T', ' ')) + ' · 저장된 면담 ' + (it.submissions || 0) + '개</div></div><div>' + btns + '</div></div>';
  }
  function load(){
    api({action:'list'}).then(function(res){
      if(!res.ok){ document.getElementById('err').textContent = res.data.error || '불러오지 못했어요.'; document.getElementById('login').hidden = false; document.getElementById('main').hidden = true; return; }
      document.getElementById('login').hidden = true; document.getElementById('main').hidden = false;
      var items = res.data.items || [];
      var groups = [['pending','승인 대기'],['approved','사용 중'],['blocked','중지됨']];
      document.getElementById('list').innerHTML = items.length ? groups.map(function(g){
        var part = items.filter(function(i){ return i.status === g[0]; });
        return part.length ? '<h2>' + g[1] + ' (' + part.length + ')</h2>' + part.map(row).join('') : '';
      }).join('') : '<p class="meta">아직 만들어진 반이 없어요.</p>';
    }).catch(function(){ document.getElementById('err').textContent = '네트워크 문제로 불러오지 못했어요.'; });
  }
  document.getElementById('enter').addEventListener('click', function(){ pin = document.getElementById('pin').value; document.getElementById('err').textContent = ''; load(); });
  document.getElementById('pin').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ document.getElementById('enter').click(); } });
  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('list').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if(!b) return;
    if(b.getAttribute('data-s') === 'blocked' && !confirm('이 반의 사용을 막을까요? 학생들이 더 이상 들어올 수 없어요.')) return;
    api({action:'set-status', key:b.getAttribute('data-k'), status:b.getAttribute('data-s')}).then(function(res){
      if(!res.ok){ alert(res.data.error || '바꾸지 못했어요.'); return; } load();
    });
  });
})();
</script>
</body>
</html>
