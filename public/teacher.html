<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 진로 면담실 · 선생님 페이지</title>
<style>
:root{
  --bg:#F2F4F8;
  --surface:#FFFFFF;
  --surface-2:#E6EAF1;
  --ink:#1C2430;
  --muted:#667085;
  --accent:#2B6CB0;
  --user-bubble:#FFE8C2;
  --user-bubble-ink:#5C3C10;
  --ai-bubble:#FFFFFF;
  --ai-bubble-border:#E1E5EC;
  --radius:16px;
  --font-display:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;
  --font-body:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121722;
    --surface:#1B222E;
    --surface-2:#242D3B;
    --ink:#E8ECF2;
    --muted:#98A2B3;
    --accent:#5B9BD5;
    --user-bubble:#3A2E18;
    --user-bubble-ink:#FCE8C2;
    --ai-bubble:#1F2733;
    --ai-bubble-border:#2E3847;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}
.app-shell{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{padding:20px 20px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;flex:none}
.topbar h1{font-family:var(--font-display);font-size:1.2rem;margin:0}
.tagline{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.app-shell{padding-bottom:env(safe-area-inset-bottom)}
.site-foot{margin-top:auto;padding:24px 20px 14px;text-align:center;font-size:.68rem;line-height:1}
.site-foot a{pointer-events:auto;color:#667085;opacity:.45;text-decoration:none}
.site-foot a:hover,.site-foot a:focus{opacity:.9;text-decoration:underline}
.view{padding:0 20px 24px;flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
[hidden]{display:none!important}
.disclaimer{background:var(--surface-2);color:var(--muted);font-size:.78rem;padding:10px 14px;border-radius:12px;margin:8px 0 16px}
.room-form{display:flex;flex-direction:column;gap:12px;max-width:380px}
.room-form label{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.room-form input,.room-form select,.room-form textarea{font:inherit;font-family:var(--font-body);background:var(--surface);color:var(--ink);border:1px solid var(--ai-bubble-border);border-radius:10px;padding:10px 12px}
.room-form textarea{resize:vertical;min-height:120px}
.room-form .row{display:flex;gap:8px}
.room-form .row label{flex:1}
.room-form .school-row{display:flex;gap:8px}
.room-form .school-row input{flex:2}
.room-form .school-row select{flex:1}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:.9rem;cursor:pointer;margin-top:4px}
.form-error{color:#B3432B;font-size:.82rem}
.btn-back{background:none;border:none;color:var(--muted);font-size:.9rem;cursor:pointer;padding:8px 0;text-align:left}
.room-badge{background:var(--surface-2);color:var(--muted);font-size:.82rem;padding:10px 14px;border-radius:12px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.room-badge button{background:none;border:none;color:var(--accent);font-size:.78rem;cursor:pointer;text-decoration:underline}
.sub-list{display:flex;flex-direction:column;gap:10px}
.sub-item{background:var(--surface);border:1px solid var(--ai-bubble-border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.sub-item-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sub-item-top strong{font-family:var(--font-display);font-size:1rem}
.sub-item-meta{color:var(--muted);font-size:.76rem}
.badge{display:inline-block;font-size:.7rem;border-radius:999px;padding:2px 9px;margin-left:6px}
.badge.in_progress{background:#FEF0C7;color:#92590B}
.badge.submitted{background:#D1FADF;color:#136C3F}
.badge.shared{background:#D6E4FF;color:#2B4ACB}
.sub-item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sub-item-actions button{font-size:.78rem;border-radius:999px;padding:6px 12px;cursor:pointer;border:1px solid var(--ai-bubble-border);background:var(--surface-2);color:var(--ink)}
.sub-item-actions button.danger{color:#B3432B;border-color:#B3432B}
.sub-item-actions button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{color:var(--muted);font-size:.9rem;padding:20px 0}
.chat-log{flex:1;display:flex;flex-direction:column;gap:10px;padding:8px 0;overflow-y:auto}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bubble-row{display:flex;flex-direction:column;gap:2px}
.bubble-row-user{align-items:flex-end}
.bubble-row-ai{align-items:flex-start}
.msg-del{background:none;border:none;color:#B3432B;font-size:.72rem;cursor:pointer;padding:2px 6px;text-decoration:underline}
.cmt-row{display:flex;align-items:flex-start;gap:6px;max-width:78%;font-size:.78rem;background:var(--surface-2);border-radius:10px;padding:5px 10px}
.cmt-row strong{margin-right:4px}
.cmt-del{background:none;border:none;color:#B3432B;font-size:.72rem;cursor:pointer;padding:0 2px;text-decoration:underline;flex:none}
.detail-note{font-size:.78rem;color:var(--muted);margin:0 0 8px}
.bubble-ai{align-self:flex-start;background:var(--ai-bubble);border:1px solid var(--ai-bubble-border);border-bottom-left-radius:4px}
.bubble-user{align-self:flex-end;background:var(--user-bubble);color:var(--user-bubble-ink);border-bottom-right-radius:4px}
.toolbar{display:flex;gap:8px;margin-bottom:8px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  'use strict';

  var SHELL_HTML = [
    '<div class="app-shell">',
    '  <header class="topbar">',
    '    <div class="brand">',
    '      <span class="brand-mark">T</span>',
    '      <div>',
    '        <h1>선생님 페이지</h1>',
    '        <p class="tagline">반 만들기 · 면담 제출함</p>',
    '      </div>',
    '    </div>',
    '  </header>',
    '  <main id="view-login" class="view">',
    '    <p class="disclaimer">우리반 암호, 학년/반 정보와 PIN으로 반을 만들거나 들어가요. 우리반 암호는 학생들이 입장할 때 쓰는 말이에요. 실명이나 반 번호처럼 다른 사람이 짐작하기 쉬운 말은 피하고 4자 이상으로 정하세요. 처음 만들 때 입력한 PIN을 꼭 기억해주세요.</p>',
    '    <form id="login-form" class="room-form">',
    '      <div class="row">',
    '        <label>학년<select id="f-grade"></select></label>',
    '        <label>반<select id="f-class"></select></label>',
    '      </div>',
    '      <label>우리반 암호<input id="f-name" autocomplete="off" placeholder="예: 별빛구름7 (4자 이상, 실명·반 번호 X)" /></label>',
    '      <label>PIN (4자리 이상)<input id="f-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="숫자 4자리 이상" /></label>',
    '      <p id="login-error" class="form-error" hidden></p>',
    '      <button type="submit" class="btn-primary">반 만들기 / 들어가기</button>',
    '    </form>',
    '    <p class="disclaimer small"><a href="/">← 학생 페이지로</a> · <a href="/admin.html">관리자 페이지 →</a></p>',
    '  </main>',
    '  <main id="view-dashboard" class="view" hidden>',
    '    <div id="room-badge" class="room-badge"></div>',
    '    <div class="toolbar">',
    '      <button type="button" id="btn-refresh" class="btn-primary">↻ 새로고침</button>',
    '      <button type="button" id="btn-figures" class="btn-primary" style="background:#2FA84F">➕ 인물 추가</button>',
    '    </div>',
    '    <p class="disclaimer small">AI는 공개된 인터뷰 자료에 실제로 나온 발언만 활용하며, 발언을 짜깁기하거나 인물의 생각·의도를 해석하지 않고 옳고 그름을 판단하지 않습니다.</p>',
    '    <div id="sub-list" class="sub-list"></div>',
    '  </main>',
    '  <main id="view-detail" class="view" hidden>',
    '    <button class="btn-back" type="button" id="btn-detail-back">← 목록으로</button>',
    '    <h2 id="detail-title" style="font-family:var(--font-display);font-size:1.05rem;margin:4px 0 10px"></h2>',
    '    <p class="disclaimer small">AI는 공개된 인터뷰 자료에 실제로 나온 발언만 활용하며, 발언을 짜깁기하거나 인물의 생각·의도를 해석하지 않고 옳고 그름을 판단하지 않습니다.</p>',
    '    <div id="detail-log" class="chat-log"></div>',
    '  </main>',
    '  <main id="view-figures" class="view" hidden>',
    '    <button class="btn-back" type="button" id="btn-figures-back">← 목록으로</button>',
    '    <h2 style="font-family:var(--font-display);font-size:1.05rem;margin:4px 0 10px">면담 인물 관리</h2>',
    '    <p class="disclaimer">실제 인터뷰 기사나 영상 내용을 참고 자료로 붙여넣어 주세요. 이 자료를 바탕으로 AI가 답해요.</p>',
    '    <form id="figure-form" class="room-form">',
    '      <label>인물 이름<input id="fig-name" autocomplete="off" placeholder="예: 유재석" /></label>',
    '      <label>직업/분야<input id="fig-job" autocomplete="off" placeholder="예: 방송인" /></label>',
    '      <label>사진(선택, 얼굴이 나온 정사각형에 가까운 사진이 좋아요)',
    '        <input id="fig-photo" type="file" accept="image/*" />',
    '      </label>',
    '      <div id="fig-photo-preview" style="display:none;width:100px;height:100px;border-radius:50%;overflow:hidden;background:var(--surface-2)"><img style="width:100%;height:100%;object-fit:cover" /></div>',
    '      <label>참고 자료 파일 불러오기(선택, PDF·Word, 한글 .hwp는 아직 지원 안 돼요)',
    '        <div class="school-row">',
    '          <input id="fig-doc-file" type="file" accept=".pdf,.doc,.docx,.hwp" style="flex:2" />',
    '          <button type="button" id="btn-doc-extract" class="btn-primary" style="margin:0;flex:1">가져오기</button>',
    '        </div>',
    '      </label>',
    '      <label>또는 웹사이트 링크에서 가져오기(선택)',
    '        <div class="school-row">',
    '          <input id="fig-url" type="url" autocomplete="off" placeholder="https://..." style="flex:2" />',
    '          <button type="button" id="btn-url-extract" class="btn-primary" style="margin:0;flex:1">가져오기</button>',
    '        </div>',
    '      </label>',
    '      <p id="fig-extract-status" class="disclaimer small" hidden></p>',
    '      <label>참고 자료(실제 인터뷰 내용)<textarea id="fig-material" placeholder="실제 인터뷰 기사나 발언 내용을 붙여넣어 주세요. 위에서 파일이나 링크로 가져오면 여기에 자동으로 채워져요 — 가져온 뒤 내용을 확인하고 다듬어 주세요."></textarea></label>',
    '      <p id="figure-error" class="form-error" hidden></p>',
    '      <button type="submit" class="btn-primary">추가하기</button>',
    '    </form>',
    '    <div id="figure-list" class="sub-list" style="margin-top:20px"></div>',
    '  </main>',
    '  <footer class="site-foot"><a href="/privacy.html" target="_blank" rel="noopener">개인정보 처리방침</a></footer>',
    '</div>'
  ].join('\n');

  var state = { auth: null, items: [], pendingPhoto: null };
  var AUTH_KEY = 'ai-interview-teacher-auth-v1';

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function loadAuth(){
    try{
      var raw = localStorage.getItem(AUTH_KEY);
      if(!raw) return null;
      var a = JSON.parse(raw);
      if(!a || !a.teacherName || !a.grade || !a.classNum || !a.token) return null;
      delete a.school; // 예전에 저장된 학교 이름은 쓰지 않는다
      return a;
    }catch(e){ return null; }
  }
  function saveAuth(a){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }catch(e){} }
  function clearAuth(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }

  function showView(name){
    ['login','dashboard','detail','figures'].forEach(function(v){
      document.getElementById('view-' + v).hidden = (v !== name);
    });
  }

  function showLoginError(msg){
    var el = document.getElementById('login-error');
    el.textContent = msg;
    el.hidden = !msg;
  }

  function statusLabel(s){
    return s === 'submitted' ? '제출됨' : '진행중';
  }

  function formatAt(iso){
    try{
      var d = new Date(iso);
      var mm = String(d.getMonth()+1).padStart(2,'0');
      var dd = String(d.getDate()).padStart(2,'0');
      var hh = String(d.getHours()).padStart(2,'0');
      var mi = String(d.getMinutes()).padStart(2,'0');
      return mm + '/' + dd + ' ' + hh + ':' + mi;
    }catch(e){ return ''; }
  }

  function renderRoomBadge(room){
    var el = document.getElementById('room-badge');
    el.innerHTML = '<span>' + escapeHtml(room.grade) + '학년 ' + escapeHtml(room.classNum) + '반 · '
      + '우리반 암호 · ' + escapeHtml(room.teacherName || '') + '</span><button type="button" id="btn-logout">다른 반으로</button>';
  }

  function loadDashboard(quiet){
    var wrap = document.getElementById('sub-list');
    if(!quiet){ wrap.innerHTML = '<p class="empty">불러오는 중...</p>'; }
    fetch('/api/submissions', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-list', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(res.data && res.data.expired){ clearAuth(); state.auth = null; showView('login'); showLoginError(res.data.error); return; }
        if(!res.ok || !(res.data && res.data.ok)){
          if(quiet) return;
          wrap.innerHTML = '<p class="empty">' + escapeHtml((res.data && res.data.error) || '불러오지 못했어요.') + '</p>';
          return;
        }
        state.items = res.data.items || [];
        renderRoomBadge({ teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, teacherName: res.data.teacherName });
        renderSubList();
      }).catch(function(){ if(!quiet){ wrap.innerHTML = '<p class="empty">네트워크 문제로 불러오지 못했어요.</p>'; } });
  }

  // 화면을 열어 두면 20초마다 조용히 새로고침해서 학생 대화를 항상 최신으로 보여 준다.
  function autoRefresh(){
    if(document.hidden || !state.auth) return;
    if(!document.getElementById('view-dashboard').hidden){ loadDashboard(true); return; }
    if(!document.getElementById('view-detail').hidden && state.detailId){
      var id = state.detailId;
      if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
      fetch('/api/submissions', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ action:'teacher-get', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, id: id })
      }).then(function(r){ return r.json(); }).then(function(data){
        if(!data || !data.ok || state.detailId !== id) return;
        if(JSON.stringify(data.item.messages) === JSON.stringify((state.detailItem || {}).messages) && JSON.stringify(data.comments || []) === JSON.stringify(state.detailComments || [])) return;
        var log = document.getElementById('detail-log');
        var atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
        var keep = log.scrollTop;
        state.detailItem = data.item;
        state.detailComments = data.comments || [];
        renderDetail(id, data.item, state.detailComments);
        if(atBottom){ log.scrollTop = log.scrollHeight; } else { log.scrollTop = keep; }
      }).catch(function(){});
    }
  }
  setInterval(autoRefresh, 20000);

  function renderSubList(){
    var wrap = document.getElementById('sub-list');
    if(!state.items.length){
      wrap.innerHTML = '<p class="empty">아직 학생들이 보낸 면담 기록이 없어요. 학생이 면담을 시작하면 자동으로 여기에 나타나요.</p>';
      return;
    }
    wrap.innerHTML = state.items.map(function(x){
      return '<div class="sub-item" data-id="' + escapeHtml(x.id) + '">'
        + '<div class="sub-item-top"><strong>' + escapeHtml(x.groupName || '') + '</strong>'
        + '<span class="badge ' + x.status + '">' + statusLabel(x.status) + '</span>'
        + (x.shared ? '<span class="badge shared">학급 공유중</span>' : '')
        + (x.flagged ? '<span class="badge" style="background:#FDECEA;color:#B42318">개인정보 의심 ○○ 처리됨</span>' : '')
        + '</div>'
        + '<span class="sub-item-meta">' + escapeHtml(x.figureName || '') + ' · ' + escapeHtml(x.figureJob || '') + ' · 메시지 ' + x.messageCount + '개 · 최근 수정 ' + formatAt(x.updatedAt) + '</span>'
        + '<div class="sub-item-actions">'
        + '<button type="button" class="act-view" data-id="' + escapeHtml(x.id) + '">보기</button>'
        + '<button type="button" class="act-rename" data-id="' + escapeHtml(x.id) + '">이름 바꾸기</button>'
        + '<button type="button" class="act-share ' + (x.shared ? 'active' : '') + '" data-id="' + escapeHtml(x.id) + '" data-shared="' + (x.shared ? '0' : '1') + '">' + (x.shared ? '공유 해제' : '학급에 공유하기') + '</button>'
        + '<button type="button" class="act-delete danger" data-id="' + escapeHtml(x.id) + '">삭제</button>'
        + '</div></div>';
    }).join('');
  }

  function renderDetail(id, item, comments){
    state.detailId = id;
    document.getElementById('detail-title').textContent = (item.groupName || '') + ' · ' + (item.figureName || '');
    var log = document.getElementById('detail-log');
    log.innerHTML = '';
    var msgs = item.messages || [];
    if(!msgs.length){
      log.innerHTML = '<p class="empty">남은 대화가 없어요.</p>';
    }
    msgs.forEach(function(m, i){
      var row = document.createElement('div');
      row.className = 'bubble-row ' + (m.role==='user' ? 'bubble-row-user' : 'bubble-row-ai');
      var b = document.createElement('div');
      b.className = 'bubble ' + (m.role==='user' ? 'bubble-user' : 'bubble-ai');
      b.textContent = m.content;
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'msg-del';
      del.setAttribute('data-index', String(i));
      del.textContent = '🗑 이 줄 삭제';
      row.appendChild(b);
      row.appendChild(del);
      (comments || []).filter(function(c){ return Number(c.messageIndex) === i; }).forEach(function(c){
        var cr = document.createElement('div');
        cr.className = 'cmt-row';
        var txt = document.createElement('span');
        var who = document.createElement('strong');
        who.textContent = (c.groupName || '') + ':';
        txt.appendChild(who);
        txt.appendChild(document.createTextNode(c.text || ''));
        var cd = document.createElement('button');
        cd.type = 'button';
        cd.className = 'cmt-del';
        cd.setAttribute('data-cid', c.id);
        cd.textContent = '삭제';
        cr.appendChild(txt);
        cr.appendChild(cd);
        row.appendChild(cr);
      });
      log.appendChild(row);
    });
  }

  function openDetail(id){
    fetch('/api/submissions', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-get', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, id: id })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ alert((data && data.error) || '불러오지 못했어요.'); return; }
      state.detailItem = data.item;
      state.detailComments = data.comments || [];
      renderDetail(id, data.item, state.detailComments);
      showView('detail');
    }).catch(function(){ alert('네트워크 문제로 불러오지 못했어요.'); });
  }

  function deleteComment(cid){
    var id = state.detailId;
    if(!id || !cid) return;
    if(!confirm('이 피드백을 삭제할까요? 되돌릴 수 없어요.')) return;
    fetch('/api/comments', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-delete', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, submissionId: id, commentId: cid })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ alert((data && data.error) || '삭제하지 못했어요.'); return; }
      openDetail(id);
    }).catch(function(){ alert('네트워크 문제로 삭제하지 못했어요.'); });
  }

  function deleteMessageLine(index){
    var id = state.detailId;
    if(!id) return;
    if(!confirm('이 줄을 삭제할까요? 삭제하면 되돌릴 수 없고, 학생 기기에 저장된 기록에서도 다음에 열 때 함께 지워져요.')) return;
    fetch('/api/submissions', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-delete-messages', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, id: id, indexes: [index] })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ alert((data && data.error) || '삭제하지 못했어요.'); return; }
      var title = document.getElementById('detail-title').textContent.split(' · ');
      openDetail(id);
    }).catch(function(){ alert('네트워크 문제로 삭제하지 못했어요.'); });
  }

  function renameItem(id){
    var current = state.items.filter(function(x){ return x.id === id; })[0];
    var next = prompt('새 모둠 이름을 입력하세요.', current ? current.groupName : '');
    if(next === null) return;
    next = next.trim();
    if(!next) return;
    fetch('/api/submissions', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-rename', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, id: id, groupName: next })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ alert((data && data.error) || '변경하지 못했어요.'); return; }
      loadDashboard();
    }).catch(function(){ alert('네트워크 문제로 변경하지 못했어요.'); });
  }

  function toggleShare(id, shared){
    fetch('/api/submissions', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-share', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, id: id, shared: shared })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ alert((data && data.error) || '변경하지 못했어요.'); return; }
      loadDashboard();
    }).catch(function(){ alert('네트워크 문제로 변경하지 못했어요.'); });
  }

  function deleteItem(id){
    if(!confirm('이 면담 기록을 삭제할까요? 되돌릴 수 없어요.')) return;
    fetch('/api/submissions', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-delete', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, id: id })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ alert((data && data.error) || '삭제하지 못했어요.'); return; }
      loadDashboard();
    }).catch(function(){ alert('네트워크 문제로 삭제하지 못했어요.'); });
  }

  function showFigureError(msg){
    var el = document.getElementById('figure-error');
    el.textContent = msg;
    el.hidden = !msg;
  }

  function loadFigureManager(){
    var wrap = document.getElementById('figure-list');
    wrap.innerHTML = '<p class="empty">불러오는 중...</p>';
    fetch('/api/figures-admin', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-list', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(!res.ok || !(res.data && res.data.ok)){
          wrap.innerHTML = '<p class="empty">' + escapeHtml((res.data && res.data.error) || '불러오지 못했어요.') + '</p>';
          return;
        }
        renderFigureList(res.data.items || []);
      }).catch(function(){ wrap.innerHTML = '<p class="empty">네트워크 문제로 불러오지 못했어요.</p>'; });
  }

  function renderFigureList(items){
    var wrap = document.getElementById('figure-list');
    if(!items.length){
      wrap.innerHTML = '<p class="empty">등록된 면담 인물이 없어요.</p>';
      return;
    }
    wrap.innerHTML = items.map(function(f){
      var thumb = f.photo
        ? '<img src="' + escapeHtml(f.photo) + '" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;margin-right:8px;vertical-align:middle" />'
        : '';
      return '<div class="sub-item">'
        + '<div class="sub-item-top">' + thumb + '<strong>' + escapeHtml(f.name) + '</strong></div>'
        + '<span class="sub-item-meta">' + escapeHtml(f.job || '') + '</span>'
        + '<div class="sub-item-actions">'
        + '<button type="button" class="act-figure-delete danger" data-id="' + escapeHtml(f.id) + '">삭제</button>'
        + '</div></div>';
    }).join('');
  }

  function handlePhotoSelect(e){
    var file = e.target.files && e.target.files[0];
    var previewWrap = document.getElementById('fig-photo-preview');
    var previewImg = previewWrap.querySelector('img');
    if(!file){ state.pendingPhoto = null; previewWrap.style.display = 'none'; return; }
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2;
        var sy = (img.height - side) / 2;
        var canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 320;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, 320, 320);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        state.pendingPhoto = dataUrl;
        previewImg.src = dataUrl;
        previewWrap.style.display = 'block';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function showExtractStatus(msg, isError){
    var el = document.getElementById('fig-extract-status');
    if(!msg){ el.hidden = true; return; }
    el.textContent = msg;
    el.style.color = isError ? '#B3432B' : '';
    el.hidden = false;
  }

  function appendMaterial(text){
    var ta = document.getElementById('fig-material');
    var current = ta.value.trim();
    ta.value = current ? (current + '\n\n' + text) : text;
  }

  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var result = reader.result || '';
        var comma = result.indexOf(',');
        resolve(comma >= 0 ? result.slice(comma + 1) : result);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function handleDocExtract(){
    var fileInput = document.getElementById('fig-doc-file');
    var file = fileInput.files && fileInput.files[0];
    if(!file){ showExtractStatus('먼저 파일을 선택해주세요.', true); return; }
    showExtractStatus('파일에서 글자를 가져오는 중...', false);
    fileToBase64(file).then(function(base64){
      return fetch('/api/extract-text', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ action:'file', filename: file.name, mime: file.type, dataBase64: base64 })
      });
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(!res.ok || !(res.data && res.data.ok)){
          showExtractStatus((res.data && res.data.error) || '파일을 가져오지 못했어요.', true);
          return;
        }
        if(res.data.text){ appendMaterial(res.data.text); showExtractStatus('파일 내용을 가져왔어요. 아래 내용을 확인해주세요.', false); }
        else { showExtractStatus(res.data.warning || '내용을 찾지 못했어요.', true); }
      }).catch(function(){ showExtractStatus('네트워크 문제로 가져오지 못했어요.', true); });
  }

  function handleUrlExtract(){
    var url = document.getElementById('fig-url').value.trim();
    if(!url){ showExtractStatus('먼저 웹사이트 주소를 입력해주세요.', true); return; }
    showExtractStatus('웹페이지에서 글자를 가져오는 중...', false);
    fetch('/api/extract-text', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'url', url: url })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(!res.ok || !(res.data && res.data.ok)){
          showExtractStatus((res.data && res.data.error) || '페이지를 가져오지 못했어요.', true);
          return;
        }
        if(res.data.text){ appendMaterial(res.data.text); showExtractStatus('웹페이지 내용을 가져왔어요. 아래 내용을 확인해주세요.', false); }
        else { showExtractStatus(res.data.warning || '내용을 찾지 못했어요.', true); }
      }).catch(function(){ showExtractStatus('네트워크 문제로 가져오지 못했어요.', true); });
  }

  function handleAddFigure(e){
    e.preventDefault();
    var name = document.getElementById('fig-name').value.trim();
    var job = document.getElementById('fig-job').value.trim();
    var material = document.getElementById('fig-material').value.trim();
    if(!name || !job || !material){
      showFigureError('이름/직업/참고 자료를 모두 입력해주세요.');
      return;
    }
    showFigureError('');
    fetch('/api/figures-admin', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-add', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, name:name, job:job, material:material, photo: state.pendingPhoto || null })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(!res.ok || !(res.data && res.data.ok)){
          showFigureError((res.data && res.data.error) || '추가하지 못했어요.');
          return;
        }
        document.getElementById('figure-form').reset();
        state.pendingPhoto = null;
        document.getElementById('fig-photo-preview').style.display = 'none';
        showExtractStatus('');
        loadFigureManager();
      }).catch(function(){ showFigureError('네트워크 문제로 추가하지 못했어요.'); });
  }

  function deleteFigure(id){
    if(!confirm('이 면담 인물을 삭제할까요?')) return;
    fetch('/api/figures-admin', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-delete', teacherName: state.auth.teacherName, grade: state.auth.grade, classNum: state.auth.classNum, token: state.auth.token, id: id })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(!data || !data.ok){ alert((data && data.error) || '삭제하지 못했어요.'); return; }
      loadFigureManager();
    }).catch(function(){ alert('네트워크 문제로 삭제하지 못했어요.'); });
  }

  function fillSelect(id, count, labelFn){
    var sel = document.getElementById(id);
    if(!sel) return;
    sel.innerHTML = '';
    for(var i = 1; i <= count; i++){
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = labelFn ? labelFn(i) : String(i);
      sel.appendChild(opt);
    }
  }

  function populateLoginSelects(){
    fillSelect('f-grade', 6);
    fillSelect('f-class', 10);
  }

  function handleLoginSubmit(e){
    e.preventDefault();
    var grade = document.getElementById('f-grade').value.trim();
    var classNum = document.getElementById('f-class').value.trim();
    var teacherName = document.getElementById('f-name').value.trim();
    var pin = document.getElementById('f-pin').value.trim();
    if(!grade || !classNum || !teacherName || !pin){
      showLoginError('모든 칸을 입력해주세요.');
      return;
    }
    showLoginError('');
    fetch('/api/room', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'teacher-login', grade:grade, classNum:classNum, teacherName:teacherName, pin:pin })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(!res.ok || !(res.data && res.data.ok)){
          showLoginError((res.data && res.data.error) || '입장에 실패했어요.');
          return;
        }
        if(res.data.status === 'pending' || res.data.status === 'blocked'){
          showLoginError(res.data.message || '아직 승인되지 않았어요.');
          return;
        }
        var auth = { teacherName:teacherName, grade:grade, classNum:classNum, token:res.data.token };
        if(res.data.migrated){ alert('저장된 면담 기록에서 학교 이름을 정리했어요. (반 ' + res.data.migrated.rooms + '개, 면담 ' + res.data.migrated.records + '개, 피드백 ' + res.data.migrated.comments + '개 정리)'); }
        state.auth = auth;
        saveAuth(auth);
        showView('dashboard');
        loadDashboard();
      }).catch(function(){ showLoginError('네트워크 문제로 입장하지 못했어요.'); });
  }

  function wireEvents(){
    document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);
    document.getElementById('figure-form').addEventListener('submit', handleAddFigure);
    document.getElementById('fig-photo').addEventListener('change', handlePhotoSelect);
    document.getElementById('btn-doc-extract').addEventListener('click', handleDocExtract);
    document.getElementById('btn-url-extract').addEventListener('click', handleUrlExtract);

    document.body.addEventListener('click', function(e){
      if(e.target.id === 'btn-refresh'){ loadDashboard(); return; }
      if(e.target.id === 'btn-logout'){
        try{ fetch('/api/room', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ action:'teacher-logout', token: state.auth && state.auth.token })}); }catch(err){}
        clearAuth();
        state.auth = null;
        showView('login');
        return;
      }
      if(e.target.id === 'btn-detail-back'){ showView('dashboard'); return; }
      if(e.target.id === 'btn-figures'){ showFigureError(''); loadFigureManager(); showView('figures'); return; }
      if(e.target.id === 'btn-figures-back'){ showView('dashboard'); return; }

      var cmtDel = e.target.closest('.cmt-del');
      if(cmtDel){ deleteComment(cmtDel.getAttribute('data-cid')); return; }
      var msgDel = e.target.closest('.msg-del');
      if(msgDel){ deleteMessageLine(Number(msgDel.getAttribute('data-index'))); return; }
      var viewBtn = e.target.closest('.act-view');
      if(viewBtn){ openDetail(viewBtn.getAttribute('data-id')); return; }
      var renameBtn = e.target.closest('.act-rename');
      if(renameBtn){ renameItem(renameBtn.getAttribute('data-id')); return; }
      var shareBtn = e.target.closest('.act-share');
      if(shareBtn){ toggleShare(shareBtn.getAttribute('data-id'), shareBtn.getAttribute('data-shared') === '1'); return; }
      var delBtn = e.target.closest('.act-delete');
      if(delBtn){ deleteItem(delBtn.getAttribute('data-id')); return; }
      var figDelBtn = e.target.closest('.act-figure-delete');
      if(figDelBtn){ deleteFigure(figDelBtn.getAttribute('data-id')); return; }
    });
  }

  function init(){
    document.getElementById('root').innerHTML = SHELL_HTML;
    wireEvents();
    populateLoginSelects();
    showView('login');
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
